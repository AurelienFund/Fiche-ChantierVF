/* ================= IMPORT PDF ================= */
let pdfjsReady = null;
function loadPdfJs(){
  if (pdfjsReady) return pdfjsReady;
  pdfjsReady = new Promise((res, rej) => {
    if (window.pdfjsLib) return res(window.pdfjsLib);
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      res(window.pdfjsLib);
    };
    s.onerror = () => rej(new Error("Impossible de charger le lecteur PDF (connexion internet requise pour la 1re utilisation)."));
    document.head.appendChild(s);
  });
  return pdfjsReady;
}
async function extractPdfText(file){
  const pdfjs = await loadPdfJs();
  const buf = await file.arrayBuffer();
  const doc = await pdfjs.getDocument({ data: buf }).promise;
  let out = "";
  for (let p = 1; p <= doc.numPages; p++){
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    let lastY = null;
    tc.items.forEach(it => {
      const y = it.transform ? it.transform[5] : null;
      if (lastY !== null && y !== null && Math.abs(y - lastY) > 3) out += "\n";
      else if (out && !out.endsWith("\n") && !out.endsWith(" ")) out += " ";
      out += it.str;
      if (y !== null) lastY = y;
    });
    out += "\n\n";
  }
  return out;
}
/* Clé de comparaison : ignore accents, casse, ponctuation et espaces multiples.
   « pietement », « Piètement » et « PIETEMENT » deviennent une seule et même entrée. */
function normKey(s){
  return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
}
/* Retire les doublons d'une liste ; garde l'orthographe de référence (celle livrée par défaut)
   quand une variante correspond, sinon la première occurrence rencontrée. */
function dedupeListe(liste, defauts){
  const prefere = {};
  (defauts || []).forEach(d => { const k = normKey(d); if (!(k in prefere)) prefere[k] = d; });
  const vus = {}, out = [];
  (liste || []).forEach(v => {
    const k = normKey(v);
    if (!k){ if (!out.includes(v)) out.push(v); return; }
    if (k in vus){
      /* doublon : si la variante conservée n'est pas l'orthographe de référence, on la corrige */
      if (prefere[k] && out[vus[k]] !== prefere[k]) out[vus[k]] = prefere[k];
      return;
    }
    vus[k] = out.length;
    out.push(prefere[k] || v);
  });
  return out;
}
/* Retrouve l'entrée existante correspondant à une valeur, quelle que soit son orthographe */
function memeChoix(liste, v){
  const k = normKey(v);
  return (liste || []).find(x => normKey(x) === k);
}
function ensureRef(listKey, v, fallback){
  if (v === "—") return "—";
  if (!v || v === AD) return fallback;
  const exist = memeChoix(state.refs[listKey], v);
  if (exist) return exist;
  state.refs[listKey].push(v); saveRefs();
  return v;
}
function ensureCascade(group, key, v, fallback){
  if (v === "—") return "—";
  if (!v || v === AD || !key || key === AD || key === "—") return fallback;
  const lst = cascadeListe(group, key);
  const exist = memeChoix(lst, v);
  if (exist) return exist;
  lst.push(v); saveRefs();
  return v;
}
function sanitizeMeuble(m){
  const out = Object.assign(newMeuble(), {
    code: m.code || "", nom: m.nom || "",
    composition: m.composition || "", notes: m.notes || "", attention: m.attention || "",
    poigneeRef: m.poigneeRef || "", nbPoignees: String(m.nbPoignees == null ? "" : m.nbPoignees),
    caissonNote: m.caissonNote || "", facadeNote: m.facadeNote || "",
    quincNote: m.quincNote || "", poigneeNote: m.poigneeNote || "",
    led: !!m.led, tringle: !!m.tringle,
    mdfFinitions: Array.isArray(m.mdfFinitions) ? m.mdfFinitions.filter(x => ["Brut","Apprêté","Peint"].includes(x)) : [],
    caissonMdfFinitions: Array.isArray(m.caissonMdfFinitions) ? m.caissonMdfFinitions.filter(x => ["Brut","Apprêté","Peint"].includes(x)) : [],
    pdtOptions: Array.isArray(m.pdtOptions) ? m.pdtOptions.filter(x => PDT_OPTIONS.includes(x)) : [],
    pdtRefs: (m.pdtRefs && typeof m.pdtRefs === "object") ? Object.assign({}, m.pdtRefs) : {},
    electroElements: Array.isArray(m.electroElements) ? m.electroElements.filter(x => ELECTRO_ELEMENTS.includes(x)) : [],
    electroRefs: (m.electroRefs && typeof m.electroRefs === "object") ? Object.assign({}, m.electroRefs) : {},
    electro: !!m.electro, quincSpec: !!m.quincSpec,
    verre: !!m.verre, verreType: ensureRef("verreTypes", m.verreType, AD), verreNote: m.verreNote || "",
    remplissage: !!m.remplissage,
    cadre: !!m.cadre,
    cadreMat: ensureRef("facadeMat", m.cadreMat, AD),
    cadreFournisseur: ensureRef("fournisseurs", m.cadreFournisseur, AD),
    cadreRef: MAT_CASCADE.includes(ensureRef("facadeMat", m.cadreMat, AD))
      ? ensureCascade("panneaux", ensureRef("fournisseurs", m.cadreFournisseur, AD), m.cadreRef, AD)
      : ensureRef("matRefs", m.cadreRef, AD),
    cadreMdfFinitions: Array.isArray(m.cadreMdfFinitions) ? m.cadreMdfFinitions.filter(x => ["Brut","Apprêté","Peint"].includes(x)) : [],
    cadreFinition: ensureRef("finitions", m.cadreFinition, AD),
    cadreVernisType: ensureRef("vernisTypes", m.cadreVernisType, AD),
    cadreHuileTeinte: ensureRef("huileTeintes", m.cadreHuileTeinte, AD),
    cadrePeintureFournisseur: ensureRef("peintureFournisseurs", m.cadrePeintureFournisseur, AD),
    cadrePeintureRef: ensureCascade("peintures", ensureRef("peintureFournisseurs", m.cadrePeintureFournisseur, AD), m.cadrePeintureRef, AD),
    cadrePeintureAspect: ensureRef("peintureAspects", m.cadrePeintureAspect, AD),
    cadreNote: m.cadreNote || "",
    simple: (m.simple === true || m.simple === false) ? m.simple : null,
    coussinMat: ensureRef("coussinMats", m.coussinMat, AD),
    coussinFournisseur: ensureRef("coussinFournisseurs", m.coussinFournisseur, AD),
    coussinModele: m.coussinModele || "", coussinNote: m.coussinNote || "",
    pdtMat: ensureRef("pdtMat", m.pdtMat, AD),
    pdtEssence: ensureRef("pdtEssences", m.pdtEssence, AD),
    pdtFinition: ensureRef("finitions", m.pdtFinition, AD),
    pdtVernisType: ensureRef("vernisTypes", m.pdtVernisType, AD),
    pdtHuileTeinte: ensureRef("huileTeintes", m.pdtHuileTeinte, AD),
    pdtPeintureFournisseur: ensureRef("peintureFournisseurs", m.pdtPeintureFournisseur, AD),
    pdtPeintureRef: ensureCascade("peintures", ensureRef("peintureFournisseurs", m.pdtPeintureFournisseur, AD), m.pdtPeintureRef, AD),
    pdtPeintureAspect: ensureRef("peintureAspects", m.pdtPeintureAspect, AD),
    pdtMdfFinitions: Array.isArray(m.pdtMdfFinitions) ? m.pdtMdfFinitions.filter(x => ["Brut","Apprêté","Peint"].includes(x)) : [],
    pdtEp: ensureRef(normKey(m.pdtMat) === normKey("Bois massif") ? "pdtEpBois" : "pdtEps", m.pdtEp, AD),
    pdtFournisseur: ensureRef("pdtFournisseurs", m.pdtFournisseur, AD),
    pdtRef: ensureCascade("planTravail", ensureRef("pdtFournisseurs", m.pdtFournisseur, AD), m.pdtRef, AD),
    electroFournisseur: ensureRef("electroFournisseurs", m.electroFournisseur, AD),
    pdtNote: m.pdtNote || "", electroNote: m.electroNote || "",
    miroirSpecs: Array.isArray(m.miroirSpecs) ? m.miroirSpecs.filter(x => MIROIR_SPECS.includes(x)) : [],
  });
  out.type = ensureRef("types", m.type, AD);
  out.livraison = ensureRef("livraisons", m.livraison, AD);
  out.caissonConstr = ensureRef("caissonConstr", m.caissonConstr, AD);
  out.caissonMat = ensureRef("caissonMat", m.caissonMat, AD);
  out.caissonFournisseur = ensureRef("fournisseurs", m.caissonFournisseur, AD);
  out.caissonRef = ensureCascade("panneaux", out.caissonFournisseur, m.caissonRef, AD);
  out.caissonFinition = ensureRef("finitions", m.caissonFinition, AD);
  out.caissonVernisType = ensureRef("vernisTypes", m.caissonVernisType, AD);
  out.caissonHuileTeinte = ensureRef("huileTeintes", m.caissonHuileTeinte, AD);
  out.caissonPeintureFournisseur = ensureRef("peintureFournisseurs", m.caissonPeintureFournisseur, AD);
  out.caissonPeintureRef = ensureCascade("peintures", out.caissonPeintureFournisseur, m.caissonPeintureRef, AD);
  out.caissonPeintureAspect = ensureRef("peintureAspects", m.caissonPeintureAspect, AD);
  out.peintureAspect = ensureRef("peintureAspects", m.peintureAspect, AD);
  out.facadeType = ensureRef("facadeTypes", m.facadeType, AD);
  out.facadeMat = ensureRef("facadeMat", m.facadeMat, AD);
  out.facadeFournisseur = ensureRef("fournisseurs", m.facadeFournisseur, AD);
  out.facadeRef = MAT_CASCADE.includes(out.facadeMat)
    ? ensureCascade("panneaux", out.facadeFournisseur, m.facadeRef, AD)
    : ensureRef("matRefs", m.facadeRef, AD);
  out.remplissageType = ensureRef("remplissageTypes", m.remplissageType, AD);
  out.tissuFournisseur = ensureRef("tissuFournisseurs", m.tissuFournisseur, AD);
  out.tissuRef = ensureCascade("tissus", out.tissuFournisseur, m.tissuRef, AD);
  out.miroirTeinte = ensureRef("miroirTeintes", m.miroirTeinte, AD);
  out.miroirPose = ensureRef("miroirPoses", m.miroirPose, AD);
  out.miroirEp = ensureRef("miroirEps", m.miroirEp, AD);
  out.finition = ensureRef("finitions", m.finition, AD);
  out.vernisType = ensureRef("vernisTypes", m.vernisType, AD);
  out.huileTeinte = ensureRef("huileTeintes", m.huileTeinte, AD);
  out.peintureFournisseur = ensureRef("peintureFournisseurs", m.peintureFournisseur, AD);
  out.peintureRef = ensureCascade("peintures", out.peintureFournisseur, m.peintureRef, AD);
  out.quincailleries = (Array.isArray(m.quincailleries) ? m.quincailleries : []).map(q => {
    const cat = ensureRef("quincSpecTypes", q.cat, AD);
    return {
      id: uid(), cat,
      detail: (cat === AD || cat === "—") ? AD : ensureCascade("quincSpecDetails", cat, q.detail, AD),
      ref: q.ref || "",
      finition: (cat === AD || cat === "—") ? AD : ensureRef("quincFinitions", q.finition, AD),
    };
  });
  out.elements = (Array.isArray(m.elements) ? m.elements : []).map(x => {
    const e2 = sanitizeMeuble(Object.assign({}, x, { code: "", nom: x.nom || x.detail || "" }));
    e2.type = ensureRef("elementTypes", x.type, AD);
    return e2;
  });
  /* ancien choix « Sans poignée » → case décochée */
  if (m.poigneeType === "Sans poignée"){ out.poignees = false; out.poigneeType = AD; }
  else { out.poignees = m.poignees !== false; out.poigneeType = ensureRef("poigneeTypes", m.poigneeType, AD); }
  if (out.poigneeType === "Bouton de porte" && m.poigneeRef && m.poigneeRef !== AD && m.poigneeRef !== "—")
    ensureRef("boutonRefs", m.poigneeRef, "");
  out.poigneePrise = ensureRef("priseTypes", renomme(m.poigneePrise), AD);
  out.profilRef = ensureRef("profilRefs", m.profilRef, AD);
  out.bequillageRef = ensureRef("bequillages", m.bequillageRef, AD);
  out.poigneeFinition = out.poigneeType === "Push-pull"
    ? ensureRef("pushPullCouleurs", m.poigneeFinition, AD)
    : ensureRef("poigneeFinitions", m.poigneeFinition, AD);
  out.tringleFinition = ensureRef("tringleFinitions", m.tringleFinition, AD);
  out.ledCouleur = ensureRef("ledCouleurs", m.ledCouleur, AD);
  out.ledEmpl = ensureRef("ledEmpl", m.ledEmpl, AD);
  return out;
}


/* ---- Analyse locale par règles (secours sans IA), calée sur les devis de l'atelier ---- */
function heuristicParse(text){
  const lines = text.split(/\n/).map(l => l.trim()).filter(Boolean)
    .filter(l => !/^Page\s+\d+\/\d+/i.test(l))
    .filter(l => !/Siret|Naf\s*:|TVA\s*:|Site internet|Powered by|IBAN|BIC\s*:|Banque\s*:|Libell[ée] du ch[èe]que|Date de validit[ée]|Signature du client|Moyen de r[èe]glement|D[ée]lai de r[èe]glement|Acompte\s*:|Avancement|Reste [àa] facturer|Total net|Montant (total|du march[ée])|rue Fonfrede|^Tel\s*:|^Email\s*:|^Mobile\s*:|Votre contact|^Nom \/ Code|^Avt\b/i.test(l))
    .filter(l => !/^[-–]?\s*\d[\d\s\u00A0.]*,\d{2}\s*(€|%)?\s*$/.test(l) && l !== "-" && l !== "–");
  const zones = [];
  let zone = null, meuble = null, etage = "", fraisLabel = false;
  const TYPE_MAP = [
    [/lit(s)? superpos/i,"Lit superposé"],[/t[êe]te de lit/i,"Tête de lit"],[/dressing/i,"Dressing"],
    [/placard|vestiaire/i,"Placard"],[/biblioth/i,"Bibliothèque"],[/chemin[ée]e/i,"Manteau de cheminée"],
    [/[ée]tag[èe]re/i,"Étagère"],[/cache[- ]?clim|console/i,"Console cache-clim"],[/cuisine|buanderie/i,"Cuisine"],
    [/banquette/i,"Banquette"],[/bureau/i,"Bureau"],[/salle de bain|meuble (sous[- ])?vasques?|sous[- ]vasque|meuble wc/i,"Salle de bain"],
    [/soubassement/i,"Soubassement"],[/habillage mural|habillage de mur|panneau mural/i,"Habillage mural"],[/pi[èe]tement/i,"Piètement"],[/tablette/i,"Tablette"],
    [/miroir/i,"Miroir"],[/plan de travail|plan de tra/i,"Plan de travail"],
    [/escalier|marche(s)? d'escalier|limon/i,"Escalier"],[/garde[- ]?corps|rambarde|main courante/i,"Garde-corps"],[/coussin|assise garnie/i,"Coussin / Tapisserie"],
  ];
  const typeOf = (s) => { for (const [re, t] of TYPE_MAP) if (re.test(s)) return t; return AD; };
  const pushMeuble = () => { if (meuble && zone) zone.meubles.push(sanitizeMeuble(meuble)); meuble = null; };
  const pushZone = () => { pushMeuble(); if (zone && zone.meubles.length) zones.push(zone); };
  const zNom = (n) => (etage ? etage + " — " : "") + n;
  const freshMeuble = (code, nom, type) => Object.assign({}, newMeuble(), {
    code: code || "", nom: nomDepuis(nom || ""), type: type || AD,
    quincailleries: [], elements: [], mdfFinitions: [], miroirSpecs: [], composition: "", notes: "", attention: "" });
  const stripPrix = (s) => s.replace(/\s+[-–]?\s*\d{1,3}(?:[\s\u00A0]\d{3})*,\d{2}\s*€?\s*$/, "").trim();
  const dimsOf = (s) => {
    const d = stripPrix(s).match(/L\.\s*±?\s*[\d\/][\dxX±,.\/\s]*(?:P\.\s*±?\s*[\d\/]+\s*x?\s*)?(?:H\.\s*±?\s*[\d\/]+)?(?:\s*x?\s*[ée]p\.?\s*\d+\s*mm)?/);
    return d ? d[0].replace(/\s+/g, " ").trim() : "";
  };
  const nomDepuis = (s) => stripPrix(s).replace(/\s*[-–]?\s*L\.\s*±?\s*[\d\/].*$/, "").trim();
  /* Titre de zone : « 2. CHAMBRE SOPHIE », « 1.1. SALON » (MAJUSCULES). Ambiguïté x.y : zone seulement si la zone courante est vide. */
  const isZoneTitle = (l) => {
    const m2 = l.match(/^(\d+(?:\.\d+)?)\.\s+([A-ZÀ-Ü0-9'\/ \-]{3,})$/);
    if (!m2) return null;
    const nom = m2[2].trim();
    if (/[a-zà-ü]/.test(nom)) return null;
    if (/^(LIVRAISON|OPTIONS?|REMISES?)$/i.test(nom)) return null;
    if (m2[1].includes(".") && zone && (zone.meubles.length || meuble)) return null;
    return nom;
  };
  const isItemLabel = (l) => {
    const m2 = l.match(/^(\d{1,2}(?:\.\d+){1,2})\.?\s+(.+)$/);
    if (!m2) return null;
    const ag = m2[2].match(/^((?:AG|MR?)\s?\.?\s?\d+(?:\.\d+)*)/i);
    return { code: ag ? ag[1].replace(/\s+/g, "") : m2[1], label: m2[2].trim() };
  };
  /* Titre avec code interne sans n° de poste : « M05 - Cuisine … », « AG.01 Bibliothèque bar à vin L. … » */
  const isCodeTitle = (l) => {
    const m2 = l.match(/^(?:[A-Za-zÀ-ü'’ .]{0,40}?)\b((?:AG|MR?)\s?\.?\s?\d+(?:\.\d+)*)\s*\.?\s*[-–]?\s*(.{3,90})$/);
    if (!m2) return null;
    if (/mise en peinture|peinture des/i.test(l)) return null;
    return { code: m2[1].replace(/\s+/g, ""), label: m2[2].trim() };
  };
  const addQuinc = (cat, detail) => {
    if (!meuble || meuble.type === "Plan de travail" || SANS_QUINC.includes(meuble.type)) return;
    if (!meuble.quincailleries) meuble.quincailleries = [];
    meuble.quincSpec = true;
    if (!meuble.quincailleries.some(q => q.cat === cat && q.detail === detail))
      meuble.quincailleries.push({ cat, detail, finition: AD, ref: "" });
  };
  const capteAspect = (l) => {
    if (!meuble) return;
    /* pas de \b final : il ne s'applique pas après une lettre accentuée (« satiné ») */
    const asp = l.match(/\b(mate?|satin[ée]e?|brillante?|velours)(?![a-zà-ÿ])/i);
    if (!asp) return;
    const a = asp[1].toLowerCase();
    meuble.peintureAspect = a.startsWith("mat") ? "Mat" : a.startsWith("satin") ? "Satiné"
      : a.startsWith("brillant") ? "Brillant" : "Velours";
  };
  /* Les repérages du parseur sont des alertes (hors lot, à confirmer…) → points d'attention */
  const addNote = (t) => { if (meuble && t && !(meuble.attention || "").includes(t)) meuble.attention = (meuble.attention ? meuble.attention + "\n" : "") + t; };
  const addCompo = (t) => { if (meuble && t) meuble.composition += (meuble.composition ? "\n" : "") + t; };
  const markPeint = () => {
    if (!meuble) return;
    if (meuble.facadeMat === "MDF" || meuble.facadeMat === AD){
      if (meuble.facadeMat === AD) meuble.facadeMat = "MDF";
      if (!meuble.mdfFinitions.includes("Peint")) meuble.mdfFinitions.push("Peint");
    } else meuble.finition = "Peint";
  };

  for (const l of lines){
    /* Niveaux et titres de zones */
    if (/^(RDC|R\+\d|SOUS[- ]SOL|[ÉE]TAGE\s*\d*)$/i.test(l)){ etage = l.toUpperCase(); continue; }
    if (/^AGENCEMENTS?$/i.test(l)) continue;
    const zt = isZoneTitle(l);
    if (zt){ pushZone(); zone = { id: uid(), nom: zNom(zt), open: true, meubles: [] }; continue; }

    if (!zone){
      /* Avant la 1re zone : infos chantier… sauf si la ligne est déjà un poste (devis sans titres de zones) */
      const ac = l.match(/Adresse chantier\s*:?\s*(.*)$/i);
      if (ac){ if (ac[1]) state.chantier.adresse = ac[1]; else state._wa = 2; continue; }
      if (state._wa){ state.chantier.adresse = (state.chantier.adresse ? state.chantier.adresse + ", " : "") + l; if (--state._wa <= 0) delete state._wa; continue; }
      const cli = l.match(/^((?:Mme|Mlle|M\.|M et Mme|M ?& ?M\.?|SAS|SARL|SCI|EURL)\s+.{2,60})$/i);
      if (cli && !state.chantier.client){
        state.chantier.client = cli[1].trim();
        state.chantier.nom = state.chantier.nom || cli[1].replace(/^(Mme|Mlle|M\.|M et Mme|M ?& ?M\.?|SAS|SARL|SCI|EURL)\s+/i, "").trim();
        continue;
      }
      const dt = l.match(/En date du\s*:?\s*(\d{2})\/(\d{2})\/(\d{4})/i);
      if (dt){ state.chantier.date = dt[3] + "-" + dt[2] + "-" + dt[1]; continue; }
      /* Ligne qui ressemble à un poste alors qu'aucune zone n'a été vue → zone par défaut */
      const ressemblePoste = isItemLabel(l) || isCodeTitle(l)
        || /^([A-Za-zÀ-ü'’\- ]{3,30}?)\s+\1\b/i.test(l)
        || (typeOf(l) !== AD && l.length < 70 && /L\.\s*±?\s*[\d\/]/.test(l));
      if (!ressemblePoste) continue;
      zone = { id: uid(), nom: zNom("AGENCEMENTS"), open: true, meubles: [] };
      /* pas de continue : la ligne est traitée normalement ci-dessous */
    }

    /* Nouveaux postes */
    const item = isItemLabel(l);
    const codeTitle = item ? null : isCodeTitle(l);
    if (item || codeTitle){
      const it = item || codeTitle;
      if (/^(mise en )?peinture/i.test(it.label) || /^(mise en )?peinture/i.test(l)){ markPeint(); capteAspect(l); continue; }
      if (/^tapisserie/i.test(it.label)){
        if (meuble){ meuble.facadeType = "Cadre + remplissage"; meuble.remplissageType = "Tissu"; }
        continue;
      }
      if (/^(livraison|d[ée]placement|frais de port|remise)/i.test(it.label)) continue;
      /* Titre descriptif du poste courant (même code interne, ou libellé fraîchement créé) → fusion, pas de doublon */
      const memeCode = meuble && meuble.code && it.code.replace(/\./g, "").toLowerCase() === meuble.code.replace(/\./g, "").toLowerCase();
      if (meuble && (memeCode || (fraisLabel && codeTitle && !meuble.composition))){
        if (codeTitle) meuble.code = it.code;
        fraisLabel = false;
        const better = nomDepuis(it.label.replace(/^((?:AG|MR?)\s?\.?\s?\d+(?:\.\d+)*)\s*\.?\s*[-–]?\s*/i, ""));
        if (better.length > 2 && (better.length > meuble.nom.length || /^(AG|MR?)[\s.]?\d/i.test(meuble.nom))) meuble.nom = better;
        if (meuble.type === AD) meuble.type = typeOf(l);
        const d0 = dimsOf(l); if (d0) addCompo(d0);
        continue;
      }
      pushMeuble();
      meuble = freshMeuble(it.code, it.label.replace(/^((?:AG|MR?)\s?\.?\s?\d+(?:\.\d+)*)\s*\.?\s*[-–]?\s*/i, ""), typeOf(it.label));
      const d = dimsOf(l);
      if (d) addCompo(d);
      fraisLabel = !d;
      continue;
    }
    /* Libellé dupliqué par la mise en page (« Miroir Miroir », « Cuve Cuve et mitigeur »…) → nouveau poste */
    const dup = l.match(/^([A-Za-zÀ-ü'’\- ]{3,30}?)\s+\1\b\s*(.*)$/i);
    if (dup && !/^(vasque|cuve|mitigeur|peinture|mise en|tapisserie|livraison|remise|variante)/i.test(dup[1])){
      pushMeuble();
      meuble = freshMeuble("", dup[1] + (dup[2] ? " — " + nomDepuis(dup[2]) : ""), typeOf(l));
      meuble.nom = meuble.nom.replace(/\s*—\s*$/, "");
      const d = dimsOf(l); if (d) addCompo(d);
      fraisLabel = !d;
      continue;
    }
    if (!meuble){
      /* Poste sans numéro ni code : ligne courte avec un type reconnaissable (hors plomberie) */
      const t = typeOf(l);
      if (t !== AD && l.length < 70 && !/^(vasque|cuve|mitigeur)\b/i.test(l)
          && !/^(Fabrication|Fourniture|Mise en|Remplissage|Plan de|Pose |Caissons?|Fa[çc]ades?|Charni|Montants?|Partie|Ouverture|Finition|Ext[ée]rieur|Int[ée]rieur)/i.test(l)){
        meuble = freshMeuble("", l, t);
        const d = dimsOf(l); if (d) addCompo(d);
      }
      continue;
    }

    /* Titre descriptif sans code interne, juste après un libellé court (ex « Placard SDB invité L.740x… ») */
    if (fraisLabel && /L\.\s*±?\s*[\d\/]/.test(l) && !/^\d/.test(l)
        && !/^(Fabrication|Fourniture|Mise en|Pose |Remplissage|Plan de)/i.test(l)){
      const better = nomDepuis(l);
      if (better.length > 2 && better.length < 70){ meuble.nom = better; if (meuble.type === AD) meuble.type = typeOf(l); }
      const d = dimsOf(l); if (d) addCompo(d);
      fraisLabel = false;
      continue;
    }
    fraisLabel = false;
    const low = l.toLowerCase();
    /* Plomberie / options / variantes → notes, pas de nouveau meuble */
    if (/^(vasque|cuve|mitigeur)\b/i.test(l)){ addNote(l); continue; }
    if (/^en option$/i.test(low)){ addNote("EN OPTION"); continue; }
    if (/^variante/i.test(low)){ addNote("VARIANTE : " + l); continue; }
    if (/mise en peinture/.test(low)){ markPeint(); capteAspect(l); continue; }

    /* Peinture atelier avec fournisseur */
    const pei = l.match(/Peinture\s+(Ressources?|Little\s*Greene|Farrow\s*&?\s*Ball|Tollens)\s+([^,;]+)/i);
    if (pei){
      const four = /ressource/i.test(pei[1]) ? "Ressource" : pei[1].trim();
      meuble.peintureFournisseur = four; meuble.peintureRef = pei[2].trim();
      markPeint();
      continue;
    }
    /* Aspect de la peinture : mat / satiné / brillant / velours */
    if (/peint|peinture|laqu[ée]/.test(low)) capteAspect(l);
    /* Caisson : mélaminé, standard/sur mesure, fournisseur + réf décor */
    if (/m[ée]lamin[ée]/.test(low)){
      meuble.caissonConstr = /standards?\b/.test(low) ? "Standard à recouper" : "Sur mesure";
      meuble.caissonMat = "Mélaminé";
      const four = l.match(/\b(Egger|Unilin|Polyrey|Fenix)\b/i);
      if (four) meuble.caissonFournisseur = four[1][0].toUpperCase() + four[1].slice(1).toLowerCase();
      const ref = l.match(/\b([UWFH]\s?\d{3,4})\b/);
      if (ref){
        let decor = "";
        if (four){
          const iF = l.indexOf(four[1]) + four[1].length, iR = l.indexOf(ref[1]);
          if (iR > iF) decor = l.slice(iF, iR).replace(/[^A-Za-zÀ-üà-ü' ]/g, " ").replace(/\s+/g, " ").trim();
        }
        meuble.caissonRef = (ref[1].replace(/\s/g, "") + (decor ? " " + decor : "")).trim();
      } else if (/evola/i.test(l)){ const ev = l.match(/Evola\s+[A-Za-zÀ-ü]+/i); if (ev) meuble.caissonRef = ev[0]; }
    }
    if (/caissons? standards?/.test(low) && meuble.caissonConstr === AD) meuble.caissonConstr = "Standard à recouper";
    if (/cp marine/.test(low)){
      meuble.caissonConstr = "Sur mesure"; meuble.caissonMat = "Multiplex / CP";
      const cm = l.match(/CP marine\s*\S*/i); if (cm) meuble.caissonNote = cm[0];
    }
    /* Façade : matières & types */
    if (/(pr[êe]t [àa] peindre|mdf brut)/.test(low)){
      meuble.facadeMat = "MDF";
      if (!meuble.mdfFinitions.includes("Brut")) meuble.mdfFinitions.push("Brut");
    } else if (/\bmdf\b/.test(low) && !/tablette|[ée]tag[èe]re|soubassement/.test(low) && meuble.facadeMat === AD) meuble.facadeMat = "MDF";
    if (/plaqu[ée]e? (ch[êe]ne|bois|noyer)/.test(low)){
      if (/fa[çc]ade|porte|visible|habillage/.test(low) || meuble.facadeMat === AD) meuble.facadeMat = "Plaqué bois";
      const es = l.match(/plaqu[ée]e?\s+(\S+)/i);
      if (es){ const ess = es[1].replace(/[,.;:]+$/, ""); if (!(meuble.facadeNote || "").includes(ess)) meuble.facadeNote = ((meuble.facadeNote ? meuble.facadeNote + " · " : "") + "plaqué " + ess); }
    }
    if (/pin massif/.test(low) && meuble.facadeMat === AD) meuble.facadeMat = "Pin massif";
    if (/[ée]pic[ée]a massif/.test(low)) meuble.facadeMat = ensureRef("facadeMat", "Épicéa massif", AD);
    if (/ch[êe]ne massif/.test(low) && meuble.facadeMat === AD) meuble.facadeMat = "Chêne massif";
    if (/stratifi[ée]/.test(low) && /fa[çc]ade|habillage|plan de travail|visible/.test(low)){
      meuble.facadeMat = "Stratifié";
      const sref = l.match(/stratifi[ée]\s+(?:type\s+)?(F\s?\d{3,4}\s+[A-Za-zÀ-ü]+|Laminati\s+\d{3,5}\s+\S+|(?:Egger|Unilin|Polyrey|Fenix|Formica|Abet)\s+\S+(?:\s+\S+)?|[A-Z]\d{3,4}\s+[A-Za-zÀ-ü]+)/i);
      if (sref){
        meuble.facadeRef = sref[1].replace(/\s+/g, " ").trim();
        if (/^F\s?\d/i.test(sref[1])) meuble.facadeFournisseur = ensureRef("fournisseurs", "Formica", AD);
        else if (/laminati/i.test(sref[1])) meuble.facadeFournisseur = ensureRef("fournisseurs", "Abet Laminati", AD);
        else { const sf = sref[1].match(/^(Egger|Unilin|Polyrey|Fenix|Formica|Abet)/i); if (sf) meuble.facadeFournisseur = ensureRef("fournisseurs", sf[1][0].toUpperCase() + sf[1].slice(1).toLowerCase(), AD); }
        if (/laminati/i.test(sref[1])) meuble.facadeRef = sref[1].replace(/^Laminati\s+/i, "").trim();
      }
    }
    if (/rainur/.test(low)) meuble.facadeType = "Rainurée";
    else if (/cadre (fin )?rapport[ée]|avec (petit )?cadre|mdf avec cadre/.test(low)) meuble.facadeType = "Cadre";
    if (/cintr[ée]e?/.test(low) && !/^\d/.test(l) && meuble.facadeType === AD) meuble.facadeType = "Cintrée";
    if (/fa[çc]ade miroir/.test(low)){ meuble.facadeType = "Cadre + remplissage"; meuble.remplissageType = "Miroir"; }
    /* Finitions */
    if (/huil[ée]/.test(low)){
      meuble.finition = "Huilé (Rubio)";
      if (/blanchi/.test(low)) meuble.huileTeinte = "White";
      if (/teint[ée]?\s*(fonc[ée]|[àa] confirmer)|teinte [àa] confirmer/.test(low)) addNote(l);
    }
    if (/vernis/.test(low)) meuble.finition = "Vernis";
    /* Tissu / cannage / remplissages */
    const tis = l.match(/tissus?\s+(Nobilis|Elitis|Elitus|Pierre\s*Frey|Casamance)\s+(.+?)(?:$|\s{2,})/i);
    if (tis){
      meuble.facadeType = meuble.facadeType === AD ? "Cadre + remplissage" : meuble.facadeType;
      if (meuble.facadeType === "Cadre + remplissage") meuble.remplissageType = "Tissu";
      meuble.tissuFournisseur = ensureRef("tissuFournisseurs", tis[1].replace(/Elitus/i, "Elitis").replace(/\s+/g, " "), AD);
      meuble.tissuRef = tis[2].trim();
    } else if (/cannage/.test(low)){ meuble.facadeType = "Cadre + remplissage"; meuble.remplissageType = "Cannage"; }
    /* Miroirs */
    if (/miroir/.test(low)){
      if (meuble.type === "Miroir"){
        if (/film[ée]/.test(low) && !meuble.miroirSpecs.includes("Filmé")) meuble.miroirSpecs.push("Filmé");
        if (/biseaut[ée]/.test(low)) addNote("Miroir biseauté");
        const ep = l.match(/[ée]p\.?\s*(\d)\s*mm/); if (ep) meuble.miroirEp = ep[1] + " mm";
      } else if (/fond|dans porte|partie haute|contour/.test(low) && !/^\d/.test(l)) addNote(l);
    }
    /* Poignées */
    const poi = l.match(/(Corston\s+\S+|Viefe\s+\S+|Graf?f\s+\S*)/i);
    if (poi){ meuble.poigneeType = "Bouton de porte"; meuble.poigneeRef = poi[1].replace(/graff/i, "Graf").trim(); }
    if (/boutons? graf/.test(low)){ meuble.poigneeType = "Bouton de porte"; meuble.poigneeRef = meuble.poigneeRef || "Graf"; }
    else if (/ouverture par bouton|\bbouton\b/.test(low) && meuble.poigneeType === AD) meuble.poigneeType = "Bouton de porte";
    if (/prise de main|prise de doigt/.test(low)) meuble.poigneeType = "Prise de doigt";
    if (/poign[ée]es? fournies? par le client/.test(low)) meuble.poigneeType = "Fournie par le client";
    if (/sans poign[ée]e|aucune poign[ée]e|pas de poign[ée]e/.test(low)) meuble.poignees = false;
    if (/poign[ée]e sur mesure/.test(low)) meuble.poigneeNote = (meuble.poigneeNote ? meuble.poigneeNote + " · " : "") + "Poignée sur mesure";
    const nb = l.match(/(\d+)\s*(unit[ée]s?|poign[ée]es?)/i);
    if (nb) meuble.nbPoignees = nb[1];
    /* Quincaillerie */
    /* Quincaillerie SPÉCIALE uniquement (le standard atelier n'est plus listé) */
    if (/hawa/.test(low)) addQuinc(/escamotable|concepta/.test(low) ? "Rail Hawa escamotable" : "Rail Hawa coulissant", AD);
    else if (/escamotable/.test(low) && !/prises?|plan de travail/.test(low)) addQuinc("Système escamotable", AD);
    if (/galandage/.test(low)) addQuinc("Coulissant à galandage", AD);
    if (/charni[èe]re.{0,20}(noir|invisible|165)/.test(low)) addQuinc(
      /noir/.test(low) ? "Charnière noire" : (/invisible|tectus/.test(low) ? "Charnière invisible" : "Charnière 165°"), AD);
    if (/air salin/.test(low)) addNote(l);
    /* Électroménager (cuisines) : fourniture et éléments */
    if (/[ée]lectrom[ée]nager|\blv\b|lave[- ]vaisselle|lave[- ]linge|hotte|frigo|r[ée]frig[ée]rateur|four\b|plaque de cuisson|micro[- ]?onde|cave [àa] vin/.test(low)){
      const fourniPar = l.match(/\b(Cojer|Coger)\b/i);
      const nonFourni = /non fourni|hors lot|fourni par le client|par le client/.test(low);
      if (fourniPar || /[ée]lectrom[ée]nager (fourni|inclus)/.test(low) || (!nonFourni && /^\d*\s*(four|hotte|frigo|plaque)/.test(low))){
        meuble.electro = true;
        if (fourniPar) meuble.electroFournisseur = "Cojer";
        else if (nonFourni) meuble.electroFournisseur = "Client direct";
      } else if (nonFourni && /[ée]lectrom[ée]nager/.test(low)){
        meuble.electro = true; meuble.electroFournisseur = "Client direct";
      }
      if (meuble.electro){
        const ajoute = (cond, nom) => {
          if (cond && !meuble.electroElements.includes(nom)) meuble.electroElements.push(nom);
        };
        ajoute(/\bfour\b/.test(low), "Four");
        ajoute(/hotte/.test(low), "Hotte");
        ajoute(/frigo|r[ée]frig[ée]rateur/.test(low), "Frigo");
        ajoute(/\blv\b|lave[- ]vaisselle/.test(low), "Lave-vaisselle");
        ajoute(/plaque de cuisson|\bplaque\b/.test(low), "Plaque");
        ajoute(/micro[- ]?onde/.test(low), "Micro-ondes");
        ajoute(/cave [àa] vin/.test(low), "Cave à vin");
        ajoute(/[ée]vier/.test(low) && !/sous[- ][ée]vier/.test(low), "Évier");
      }
    }
    /* Tringle & LED */
    if (/tringle|penderie/.test(low)) meuble.tringle = true;
    if (/\bled/.test(low)){
      meuble.led = true;
      if (/sous [ée]tag/.test(low)) meuble.ledEmpl = ensureRef("ledEmpl", "Sous étagères", AD);
      else if (/joue/.test(low)) meuble.ledEmpl = "Joues à la verticale";
    }
    /* Garde-corps : remplissage verre et son modèle */
    if (estGardeCorps(meuble) && /verre|vitrage|vitr[ée]/.test(low)){
      meuble.verre = true;
      if (/feuillet/.test(low)) meuble.verreType = ensureRef("verreTypes", "Feuilleté", AD);
      else if (/tremp/.test(low)) meuble.verreType = ensureRef("verreTypes", "Trempé", AD);
      else if (/arm[ée]/.test(low)) meuble.verreType = ensureRef("verreTypes", "Armé", AD);
    }
    /* Coussin / Tapisserie : matière, fournisseur et modèle */
    if (estCoussin(meuble)){
      if (/papier peint/.test(low)) meuble.coussinMat = ensureRef("coussinMats", "Papier peint", AD);
      else if (/tissus?|garniture|ouate/.test(low)) meuble.coussinMat = ensureRef("coussinMats", "Tissu", AD);
      const fc = l.match(/\b(Florence|Mimilo)\b/i);
      if (fc) meuble.coussinFournisseur = ensureRef("coussinFournisseurs",
        fc[1][0].toUpperCase() + fc[1].slice(1).toLowerCase(), AD);
      /* « Modèle : … » l'emporte toujours ; sinon « Tissus X » sert de repli, sans le nom du fournisseur */
      const modExp = l.match(/(?:mod[èe]le|r[ée]f[ée]rence)\s*:\s*(.{2,60})$/i);
      if (modExp) meuble.coussinModele = modExp[1].replace(/[.,;]+$/, "").trim();
      else if (!meuble.coussinModele){
        const modImp = l.match(/tissus?\s+(.{2,60})$/i);
        if (modImp){
          const reste = modImp[1].replace(/\b(Florence|Mimilo)\b/ig, "").replace(/[.,;]+$/, "").trim();
          if (reste.length > 1) meuble.coussinModele = reste;
        }
      }
    }
    /* Plan de travail : matière, fournisseur et usinages */
    if (/plan de travail|plan de tra|cr[ée]dence|plateau (en|de) (pierre|dekton|corian|marbre|granit)/.test(low)){
      const pdtCible = (meuble.type === "Plan de travail") ? meuble : null;
      const matPdt = l.match(/\b(Dekton|Corian|Marbre|Granit|Qwartz|Quartz|C[ée]ramique|Inox)\b/i);
      if (pdtCible && matPdt){
        const nom = matPdt[1][0].toUpperCase() + matPdt[1].slice(1).toLowerCase();
        pdtCible.pdtMat = ensureRef("pdtMat", /qwartz|quartz/i.test(nom) ? "Quartz" : nom, AD);
      }
      const fourPdt = l.match(/\b(Granico|HMS)\b/i);
      if (pdtCible && fourPdt) pdtCible.pdtFournisseur = ensureRef("pdtFournisseurs", fourPdt[1].toUpperCase() === "HMS" ? "HMS" : "Granico", AD);
      /* Bois massif : essence à la place du fournisseur */
      if (pdtCible){
        const ess = l.match(/\b(ch[êe]ne|h[êe]tre|fr[êe]ne|noyer)\b/i);
        if (ess && /massif|bois/.test(low)){
          const e = normKey(ess[1]);
          pdtCible.pdtMat = ensureRef("pdtMat", "Bois massif", AD);
          pdtCible.pdtEssence = ensureRef("pdtEssences",
            e === "chene" ? "Chêne" : e === "hetre" ? "Hêtre" : e === "frene" ? "Frêne" : "Noyer", AD);
        }
      }
      if (!pdtCible && /hors lot|non fourni|non pr[ée]vu/.test(low)) addNote(l);
    }
    if (meuble.type === "Plan de travail"){
      /* Épaisseur : « ép 30mm », « épaisseur 20 mm », « ép. 12mm » */
      const ep = l.match(/[ée]p(?:aisseur)?\.?\s*(\d{1,3})\s*mm/i);
      if (ep){
        const val = ep[1] + " mm";
        const liste = estPdtBois(meuble) ? "pdtEpBois" : "pdtEps";
        meuble.pdtEp = ensureRef(liste, val, AD);
      }
      /* la finition détectée par les règles générales s'applique au plan de travail */
      if (meuble.finition !== AD && meuble.pdtFinition === AD){
        meuble.pdtFinition = meuble.finition;
        if (meuble.huileTeinte !== AD) meuble.pdtHuileTeinte = meuble.huileTeinte;
        if (meuble.vernisType !== AD) meuble.pdtVernisType = meuble.vernisType;
      }
      const opt = (cond, nom) => { if (cond && !meuble.pdtOptions.includes(nom)) meuble.pdtOptions.push(nom); };
      opt(/rainurage|rainur[ée]|[ée]gouttoir/.test(low), "Rainurage");
      opt(/\bcuve\b|[ée]vier encastr/.test(low), "Cuve");
      opt(/robinet|mitigeur/.test(low), "Robinet");
      opt(/\bprises?\b/.test(low), "Prises");
      opt(/plaque de cuisson|d[ée]coupe plaque/.test(low), "Plaque");
    }
    /* Notes & points d'attention */
    if (/attention|non fournis?|non pr[ée]vu|hors lot|double fond|r[ée]servation|ballon|[àa] confirmer|pr[ée]voir renfort|renfort dans le mur|estimation|en attente de plans|pas d'[ée]l[ée]vation|non compris/i.test(l)){
      addNote(l);
    }
    /* Composition */
    if (/^\d+\s+(colonnes?|caissons?|espaces?|sous[- ]?[ée]viers?|structures?|t[êe]tes?|joues?|tablettes?|dessus|corniches?|r[ée]servations?|manteaux?|consoles?|portes?|tiroirs?|[ée]tag[èe]res?|banquettes?|bureaux?|penderies?|niches?|plateaux?|pieds?|jambages?|cadres?|miroirs?|fonds?|s[ée]parations?|montants?|traverses?|meubles?|vaisseliers?|biblioth[èe]ques?|[ée]l[ée]ments?|grandes?\s+portes?|petits?\s+tiroirs?|ensembles?|cintr[ée]s)/i.test(l)
        || /^(Raidisseurs?|Fileurs?|Suite \d|Plinthes?|Bandeaux?|Moulures?|Boudins?|[ÉE]paisseur|[ÉE]tag[èe]res? (en|ouvertes)|Mur |C[ôo]t[ée] |Bibli|Espace pour|Pour chaque)/i.test(l)
        || (meuble.type === "Miroir" && /L\.\s*±?\s*[\d\/]/.test(l) && !/^(Fourniture|Fabrication|Pose)/i.test(l))){
      addCompo(stripPrix(l));
    }
  }
  pushZone();
  return zones;
}

/* ---- Import d'un ou plusieurs devis PDF ---- */
async function importDevisPDFs(files){
  const btn = document.getElementById("btnPdf");
  btn.disabled = true;
  const zonesAll = [];
  const echecs = [];
  try {
    for (let i = 0; i < files.length; i++){
      const f = files[i], num = "Devis " + (i + 1) + "/" + files.length;
      setStatus("wait", num + " — lecture et analyse de « " + f.name + " »…");
      let text = "";
      try { text = await extractPdfText(f); }
      catch(e){ echecs.push(f.name + " : " + (e.message || e)); continue; }
      if (!text || text.trim().length < 40){ echecs.push(f.name + " : PDF sans texte lisible (scan image ?)"); continue; }
      const zs = heuristicParse(text);
      if (zs.length) zs.forEach(z => zonesAll.push(z));
      else echecs.push(f.name + " : aucun agencement identifié dans ce document");
    }
    const nbAg = zonesAll.reduce((s, z) => s + z.meubles.length, 0);
    if (!nbAg) throw new Error(echecs.length ? echecs.join(" ; ") : "aucun agencement extrait");
    let ajouter = false;
    if (!ficheEstVide()){
      ajouter = confirm("Une fiche est déjà en cours.\n\nOK → AJOUTER les zones importées à la suite de la fiche actuelle.\nAnnuler → REMPLACER les zones actuelles par celles importées.");
    }
    state.zones = ajouter ? state.zones.concat(zonesAll) : zonesAll;
    renderChantier(); renderZones(); saveAutoNow();
    let msg = "Import terminé : " + zonesAll.length + " zone(s), " + nbAg + " agencement(s)" + (ajouter ? " ajoutés à la fiche" : "") + ".";
    msg += " Vérifiez chaque agencement — les éléments non reconnus sont « À définir » (en rouge à l'impression).";
    if (echecs.length) setStatus("err", msg + " ÉCHECS : " + echecs.join(" ; "));
    else setStatus("ok", msg);
  } catch (err){
    setStatus("err", "Échec de l'import de devis : " + (err.message || err));
  } finally {
    btn.disabled = false;
  }
}

/* ---- Import d'une fiche PDF (imprimée depuis l'outil) ---- */
/* Cumule deux valeurs de cartouche sans doublon : « DEV-001 + DEV-002 » */
function cumule(actuel, ajout){
  const a = (actuel || "").trim(), b = (ajout || "").trim();
  if (!b) return a;
  if (!a) return b;
  const deja = a.split(/\s*\+\s*/).map(normKey);
  if (deja.includes(normKey(b))) return a;
  return a + " + " + b;
}
function applyFicheImport(d, viaIA, ajouter){
  const zs = (Array.isArray(d.zones) ? d.zones : []).map(z => ({
    id: uid(), nom: String(z.nom || ""), open: true,
    meubles: (Array.isArray(z.meubles) && z.meubles.length ? z.meubles : [newMeuble()]).map(viaIA ? sanitizeMeuble : reviveMeuble),
  }));
  const c = d.chantier || {};
  if (ajouter){
    /* on complète le cartouche sans écraser, et on cumule les numéros */
    const cur = state.chantier;
    cur.dossier = cumule(cur.dossier, c.dossier);
    cur.devis = cumule(cur.devis, c.devis);
    ["nom","client","adresse","contact","date","accesPrecision"].forEach(k => {
      if (!cur[k] && c[k]) cur[k] = c[k];
    });
    if ((!cur.acces || cur.acces === "Plain-pied") && c.acces) cur.acces = ensureRef("acces", c.acces, cur.acces || "Plain-pied");
    if (typeof d.generalites === "string" && d.generalites && !(state.generalites || "").includes(d.generalites))
      state.generalites = state.generalites ? state.generalites + "\n" + d.generalites : d.generalites;
    state.zones = state.zones.concat(zs);
  } else {
    state.chantier = Object.assign({ nom:"", client:"", dossier:"", devis:"", adresse:"", contact:"", date:"", acces:"Plain-pied", accesPrecision:"" }, c);
    state.chantier.acces = ensureRef("acces", state.chantier.acces, "Plain-pied");
    state.generalites = typeof d.generalites === "string" ? d.generalites : "";
    state.zones = zs.length ? zs : [newZone("")];
  }
  renderChantier(); renderZones(); saveAutoNow();
  return zs.reduce((s, z) => s + z.meubles.length, 0);
}
/* Retrouve les données de réimportation dans le texte d'un PDF, en tolérant
   les espaces, les retours à la ligne et un marqueur de fin perdu à la découpe. */
function extraireBlocFiche(text){
  const plat = text.replace(/[\s\u00AD\u200B]+/g, "");   /* espaces, césures et espaces fines */
  const iDeb = plat.search(/FICHEDATAv\d+\./);
  if (iDeb < 0){
    throw new Error("données de réimportation introuvables dans ce PDF. " +
      "Seules les fiches imprimées depuis l'outil en contiennent (de façon invisible). " +
      "Un PDF scanné, photographié, réimprimé depuis un autre logiciel ou assemblé les perd. " +
      "Si la fiche a été imprimée avec une version antérieure à aujourd'hui, réimprimez-la depuis l'outil, " +
      "ou utilisez son export JSON.");
  }
  const reste = plat.slice(iDeb).replace(/^FICHEDATAv\d+\./, "");
  const fin = reste.indexOf(".FINFICHE");
  const b64 = (fin >= 0 ? reste.slice(0, fin) : reste).replace(/[^A-Za-z0-9+/=]/g, "");
  if (!b64) throw new Error("les données de réimportation de ce PDF sont vides ou illisibles.");
  try {
    return JSON.parse(b64DecodeUtf8(b64));
  } catch(e){
    throw new Error("les données de réimportation de ce PDF sont incomplètes" +
      (fin < 0 ? " (fin du bloc absente : le PDF a probablement été tronqué ou recomposé)" : "") +
      ". Réimprimez la fiche depuis l'outil, ou utilisez son export JSON.");
  }
}
async function importFichePDF(f){
  let ajouter = false;
  if (!ficheEstVide()){
    ajouter = confirm("Une fiche est déjà en cours.\n\n" +
      "OK → AJOUTER la fiche importée à la suite (zones cumulées, n° de dossier et de devis cumulés).\n" +
      "Annuler → REMPLACER la fiche actuelle par celle du PDF.");
    if (!ajouter && !confirm("Remplacer définitivement la fiche en cours ?\nPensez à l'exporter (JSON) ou l'imprimer avant.")) return;
  }
  const btn = document.getElementById("btnFiche");
  btn.disabled = true;
  setStatus("wait", "Lecture de la fiche PDF…");
  try {
    const text = await extractPdfText(f);
    if (!text || text.trim().length < 20) throw new Error("PDF sans texte lisible (scan image ? photo ?). Utilisez le PDF d'origine.");
    const d = extraireBlocFiche(text);
    const nb = applyFicheImport(d, false, ajouter);
    const vieux = d.v && d.v !== APP_VERSION
      ? " ATTENTION : cette fiche a été imprimée avec une version antérieure (" + d.v +
        ") — les champs ajoutés depuis sont vides et restent à compléter."
      : "";
    setStatus(vieux ? "err" : "ok", ajouter
      ? "Fiche ajoutée à la suite : " + nb + " agencement(s) importé(s). Total : " + state.zones.length +
        " zone(s), " + state.zones.reduce((s, z) => s + z.meubles.length, 0) + " agencement(s)." +
        (state.chantier.devis ? " Devis : " + state.chantier.devis + "." : "") + vieux
      : "Fiche réimportée à l'identique : " + state.zones.length + " zone(s), " + nb + " agencement(s)." + vieux);
  } catch (err){
    setStatus("err", "Échec de l'import de la fiche : " + (err.message || err));
  } finally {
    btn.disabled = false;
  }
}

/* ================= BRANCHEMENTS ================= */
/* Le navigateur propose le titre de la page comme nom de fichier PDF :
   on le remplace le temps de l'impression, puis on le remet. */
const TITRE_APP = document.title;
function titreImpression(){
  const c = state.chantier;
  const base = (c.nom || c.adresse || "sans nom").trim();
  /* caractères interdits dans un nom de fichier */
  return ("Fiche - " + base).replace(/[\\/:*?"<>|]+/g, " ").replace(/\s+/g, " ").trim();
}
function imprimerFiche(){
  try {
    buildSheet();
    document.title = titreImpression();
    window.print();
  } catch(e){
    setStatus("err", "Erreur lors de la préparation de l'impression : " + (e.message || e));
  }
}
document.getElementById("btnPrint").addEventListener("click", imprimerFiche);
/* impression lancée depuis le menu du navigateur (Ctrl+P) */
window.addEventListener("beforeprint", () => {
  try { buildSheet(); document.title = titreImpression(); } catch(e){}
});
window.addEventListener("afterprint", () => { document.title = TITRE_APP; });
document.getElementById("btnExportJson").addEventListener("click", exportJSON);
document.getElementById("btnImportJson").addEventListener("click", () => document.getElementById("fileJson").click());
document.getElementById("fileJson").addEventListener("change", e => { if (e.target.files[0]) importJSONFile(e.target.files[0]); e.target.value = ""; });
document.getElementById("btnPdf").addEventListener("click", () => document.getElementById("filePdf").click());
document.getElementById("filePdf").addEventListener("change", e => { if (e.target.files.length) importDevisPDFs(Array.from(e.target.files)); e.target.value = ""; });
document.getElementById("btnFiche").addEventListener("click", () => document.getElementById("fileFiche").click());
document.getElementById("fileFiche").addEventListener("change", e => { if (e.target.files[0]) importFichePDF(e.target.files[0]); e.target.value = ""; });
document.getElementById("btnAddZone").addEventListener("click", () => { state.zones.push(newZone("")); renderZones(); });

/* Ouverture : page vierge ; si une fiche est sauvegardée, on PROPOSE de la reprendre */
renderChantier();
renderZones();
initResume();
if (STORE.volatile){
  setStatus("err", "Aperçu sans stockage permanent : la fiche ne sera pas conservée après fermeture de cette page. " +
    "Exportez en JSON ou imprimez en PDF pour garder votre travail. La version en ligne, elle, sauvegarde automatiquement.");
}
</script>
