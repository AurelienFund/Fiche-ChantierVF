<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --papier:#F6F4EE; --carte:#FFFFFF; --encre:#221B12; --encre2:#5C5346;
  --ligne:#DED8CB; --marron:#6E4B33; --marron-f:#4A3021; --pin:#EDE4D3; --rouge:#C22B1E;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--papier);color:var(--encre);font-family:'Public Sans',sans-serif;font-size:13px;padding:0 0 80px}
.mono{font-family:'IBM Plex Mono',monospace}
.cartouche{background:var(--marron-f);color:#F3EDE3;padding:22px 26px 18px;border-bottom:5px solid var(--marron)}
.cartouche h1{font-family:'Archivo',sans-serif;font-stretch:110%;font-weight:800;font-size:24px;margin:0;letter-spacing:.5px;text-transform:uppercase}
.cartouche .sub{font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.75;margin-top:4px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{font-family:'Archivo',sans-serif;font-weight:600;font-size:12px;padding:8px 14px;border-radius:4px;border:1px solid var(--ligne);background:var(--carte);color:var(--encre);cursor:pointer}
.btn:hover{border-color:var(--marron)}
.btn.dark{background:var(--marron);border-color:var(--marron);color:#fff}
.btn.ghost{background:transparent;border-color:rgba(243,237,227,.35);color:#F3EDE3}
.btn.ghost:hover{border-color:#F3EDE3}
.btn:focus-visible{outline:2px solid var(--marron);outline-offset:2px}
.btn:disabled{opacity:.55;cursor:wait}
.status{margin-top:10px;padding:9px 12px;border-radius:4px;font-size:12px;display:flex;align-items:center;gap:10px}
.status.wait{background:rgba(243,237,227,.12);color:#F3EDE3;border:1px dashed rgba(243,237,227,.4)}
.status.ok{background:#E6EFE2;color:#2F4A2B;border:1px solid #9DB894}
.status.err{background:#F5E3DC;color:#7A3020;border:1px solid #D9A28E}
.status-x{margin-left:auto;border:none;background:transparent;color:inherit;font-size:14px;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:20px 18px}
.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:6px;padding:16px 18px;margin-bottom:14px}
.carte h2{font-family:'Archivo',sans-serif;font-weight:700;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--marron);margin:0 0 12px}
.grid{display:flex;flex-wrap:wrap;gap:10px}
.fld{display:flex;flex-direction:column;gap:3px;flex:1;min-width:140px}
.fld.fix{flex:0 0 auto}
.fld-l{font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--encre2)}
.inp{border:1px solid var(--ligne);border-radius:4px;padding:7px 9px;font:inherit;background:#FDFCF9;color:var(--encre);width:100%}
.inp:focus{outline:2px solid var(--marron);outline-offset:-1px}
select.inp.ad-val{color:var(--rouge);font-weight:600}
textarea.inp{resize:vertical;min-height:60px;font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.5}
.inp.bulle{border-style:dashed;background:#FBF7EE;font-style:italic}
select.inp option.opt-add{font-style:italic;color:var(--marron)}

.mini-sel:hover{border-color:var(--marron)}

<script>
/* ================= CONSTANTES ================= */
const APP_VERSION = "v9";
/* Stockage : localStorage quand il est accessible (page hébergée, fichier local),
   sinon repli en mémoire pour que l'outil reste utilisable en aperçu sandboxé.
   Dans ce cas, les données vivent le temps de la session : à exporter en JSON ou PDF. */
const STORE = (function(){
  try {
    const t = "__fc_test__";
    window.localStorage.setItem(t, "1");
    window.localStorage.removeItem(t);
    return window.localStorage;
  } catch(e){
    const mem = Object.create(null);
    return {
      volatile: true,
      getItem: k => (k in mem ? mem[k] : null),
      setItem: (k, v) => { mem[k] = String(v); },
      removeItem: k => { delete mem[k]; },
    };
  }
})();
const AD = "À définir";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const deep = (o) => JSON.parse(JSON.stringify(o));

function saveRefs(){
  try { STORE.setItem("ficheChantierBase",
    JSON.stringify({ refs: state.refs, cascades: state.cascades, usage: state.usage,
      typesSimples: state.typesSimples, seen: DEFAULT_REFS })); } catch(e){}
}
function loadRefs(){
  try {
    const saved = JSON.parse(STORE.getItem("ficheChantierBase"));
    if (!saved) return;
    /* « seen » = choix par défaut connus lors de la dernière sauvegarde. Tout choix par défaut
       AJOUTÉ depuis (nouvelle version de l'outil) est réintégré ; ceux que l'utilisateur a
       volontairement retirés ne reviennent pas. */
    const seen = saved.seen || {};
    if (saved.refs) for (const k in state.refs){
      if (!Array.isArray(saved.refs[k]) || !saved.refs[k].length) continue;
      const liste = dedupeListe(saved.refs[k].map(renomme), DEFAULT_REFS[k]);
      /* Sans marqueur « seen » (base enregistrée par une version antérieure), on réintègre tous les
         choix par défaut manquants : c'est le rattrapage unique qui fait apparaître les nouveautés. */
      const connus = Array.isArray(seen[k]) ? seen[k] : [];
      (DEFAULT_REFS[k] || []).forEach(v => {
        if (!memeChoix(connus, v) && !memeChoix(liste, v)) liste.push(v);
      });
      state.refs[k] = dedupeListe(liste, DEFAULT_REFS[k]);
    }
    if (saved.cascades) for (const g in state.cascades){
      if (saved.cascades[g]) for (const f in saved.cascades[g]){
        if (Array.isArray(saved.cascades[g][f]) && saved.cascades[g][f].length)
          state.cascades[g][f] = dedupeListe(saved.cascades[g][f].map(renomme), (DEFAULT_CASCADES[g] || {})[f]);
      }
    }
    if (saved.usage) state.usage = saved.usage;
    if (Array.isArray(saved.typesSimples)) state.typesSimples = dedupeListe(saved.typesSimples, []);
  } catch(e){}
}
function cascadeListe(group, key){
  if (!key || key === AD) return [AD];
  if (!state.cascades[group]) state.cascades[group] = {};
  if (!state.cascades[group][key]) state.cascades[group][key] = [AD];
  return state.cascades[group][key];
}
loadRefs();

/* ---- Sauvegarde automatique de la fiche en cours (localStorage du navigateur) ---- */
const AUTOKEY = "ficheChantierAuto";
let autoTimer = null;
function saveAutoNow(){
  if (resumeVisible()){
    if (ficheEstVide()) return;   /* la fiche affichée est vierge : ne pas écraser la sauvegarde proposée */
    hideResume();                 /* saisie réelle : la nouvelle fiche remplace l'ancienne sauvegarde */
  }
  try {
    STORE.setItem(AUTOKEY, JSON.stringify({
      v: APP_VERSION, savedAt: new Date().toISOString(),
      chantier: state.chantier, generalites: state.generalites, zones: state.zones,
    }));
  } catch(e){}
}
function resumeVisible(){ const b = document.getElementById("resumeBox"); return !!(b && b.firstChild); }
function hideResume(){ const b = document.getElementById("resumeBox"); if (b) b.innerHTML = ""; }
function peekAuto(){
  try {
    const d = JSON.parse(STORE.getItem(AUTOKEY));
    if (!d) return null;
    const nonVide = (d.zones || []).some(z => z.nom || (z.meubles || []).some(m => m.nom || m.code || (m.type && m.type !== AD)))
      || (d.chantier && (d.chantier.nom || d.chantier.client || d.chantier.adresse || d.chantier.date || d.chantier.contact)) || d.generalites;
    return nonVide ? d : null;
  } catch(e){ return null; }
}
function initResume(){
  const d = peekAuto();
  if (!d) return;
  const quand = d.savedAt ? new Date(d.savedAt).toLocaleString("fr-FR") : "";
  document.getElementById("resumeBox").appendChild(el("div", { class: "status ok" },
    "Une fiche est sauvegardée dans ce navigateur" +
      (d.chantier && (d.chantier.nom || d.chantier.adresse) ? " — " + (d.chantier.nom || d.chantier.adresse) : "") +
      (quand ? " (enregistrée le " + quand + ")" : "") + ". ",
    el("button", { class: "btn mini", style: "margin-left:8px", onclick: () => {
      loadAuto(); renderChantier(); renderZones(); hideResume();
      setStatus("ok", "Fiche précédente reprise — la sauvegarde continue automatiquement.");
    } }, "Reprendre cette fiche"),
    el("button", { class: "btn mini", style: "margin-left:6px", onclick: () => {
      try { STORE.removeItem(AUTOKEY); } catch(e){}
      hideResume();
    } }, "Repartir de zéro (efface la sauvegarde)")));
}
function saveAuto(){ clearTimeout(autoTimer); autoTimer = setTimeout(saveAutoNow, 400); }
function loadAuto(){
  try {
    const d = JSON.parse(STORE.getItem(AUTOKEY));
    if (!d) return false;
    state.chantier = Object.assign({ nom:"", client:"", adresse:"", contact:"", date:"", acces:"Plain-pied", accesPrecision:"" }, d.chantier);
    state.generalites = typeof d.generalites === "string" ? d.generalites : "";
    if (Array.isArray(d.zones) && d.zones.length){
      state.zones = d.zones.map(z => ({ id: uid(), nom: z.nom || "", open: z.open !== false, meubles: (z.meubles || []).map(reviveMeuble) }));
    }
    return true;
  } catch(e){ return false; }
}
function ficheEstVide(){
  const c = state.chantier;
  return !c.nom && !c.client && !c.adresse && !c.date && !c.contact && !state.generalites &&
    state.zones.every(z => !z.nom && z.meubles.every(m => !m.nom && !m.code && m.type === AD));
}
document.addEventListener("input", saveAuto);
document.addEventListener("change", saveAuto);
document.addEventListener("click", saveAuto);
window.addEventListener("beforeunload", saveAutoNow);

function bump(usageKey, v){
  if (!usageKey || !v || v === AD || v === "—") return;
  if (!state.usage[usageKey]) state.usage[usageKey] = {};
  state.usage[usageKey][v] = (state.usage[usageKey][v] || 0) + 1;
  saveRefs();
}
function sortedList(list, usageKey){
  const u = (usageKey && state.usage[usageKey]) || {};
  const head = list.filter(v => v === AD || v === "—");
  const rest = list.filter(v => v !== AD && v !== "—");
  const idx = new Map(rest.map((v, i) => [v, i]));
  rest.sort((a, b) => ((u[b] || 0) - (u[a] || 0)) || (idx.get(a) - idx.get(b)));
  return head.concat(rest);
}

/* ================= HELPERS DOM ================= */
function el(tag, attrs, ...children){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){
    if (k === "class") n.className = attrs[k];
    else if (k === "style") n.setAttribute("style", attrs[k]);
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else if (k === "checked") n.checked = !!attrs[k];
    else if (k === "disabled"){ if (attrs[k]) n.setAttribute("disabled", "disabled"); }
    else if (k === "value") n.value = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  children.flat(Infinity).forEach(c => { if (c == null || c === "") return; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return n;
}
function field(label, node, width){
  return el("label", { class: "fld" + (width ? " fix" : ""), style: width ? "width:" + width : "" },
    el("span", { class: "fld-l" }, label), node);
}
function bulle(m, key){
  return field("💬 Autres possibilités / précisions",
    el("input", { class: "inp bulle", value: m[key] || "", placeholder: "noter librement d'autres options…",
      oninput: e => { m[key] = e.target.value; } }));
}
function makeSelect(listKeyOrGet, value, onPick, usageKey){
  const getList = typeof listKeyOrGet === "string" ? () => state.refs[listKeyOrGet] : listKeyOrGet;
  const uKey = usageKey || (typeof listKeyOrGet === "string" ? listKeyOrGet : "");
  const estListeTypes = (listKeyOrGet === "types");
  const sel = el("select", { class: "inp" });
  const paint = () => { sel.classList.toggle("ad-val", sel.value === AD); };
  const rebuild = () => {
    sel.innerHTML = "";
    const list = getList() || [];
    let opts = sortedList(list.slice(), uKey);
    if (!opts.includes(AD)) opts.unshift(AD);
    if (!opts.includes("—")) opts.splice(opts.indexOf(AD) + 1, 0, "—");
    if (value && !opts.includes(value)){
      const eq = memeChoix(opts, value);
      if (eq) value = eq;               /* même choix, orthographe différente : on s'aligne */
      else opts.unshift(value);
    }
    opts.forEach(o => sel.appendChild(el("option", { value: o }, o)));
    if (estListeTypes){
      sel.appendChild(el("option", { value: "__add__", class: "opt-add" }, "＋ Ajouter un type détaillé…"));
      sel.appendChild(el("option", { value: "__addsimple__", class: "opt-add" }, "＋ Ajouter un type simple…"));
    } else {
      sel.appendChild(el("option", { value: "__add__", class: "opt-add" }, "＋ Ajouter un choix…"));
    }
    sel.appendChild(el("option", { value: "__del__", class: "opt-add" }, "－ Retirer un choix…"));
    sel.value = value;
    paint();
  };
  rebuild();
  sel.addEventListener("change", () => {
    if (sel.value === "__add__" || sel.value === "__addsimple__"){
      const simple = (sel.value === "__addsimple__");
      const invite = estListeTypes
        ? (simple
            ? "Nouveau type SIMPLE (aménagement ou élément simple : matière & finition, quincaillerie, LED,\ncomposition et notes — comme Tête de lit ou Étagère).\n\nNom du type :"
            : "Nouveau type DÉTAILLÉ (agencement complet : caisson, façade, poignées, tringle, LED…\ncomme Dressing ou Placard).\n\nNom du type :")
        : "Nouveau choix à ajouter dans la liste (conservé dans votre base) :";
      const v = (prompt(invite) || "").trim();
      if (v){
        const list = getList();
        const exist = memeChoix(list, v);
        if (exist) value = exist;          /* déjà présent (accents/casse près) : on le réutilise */
        else { list.push(v); value = v; }
        if (estListeTypes){
          /* mémorise le mode du type : simple ou détaillé */
          state.typesSimples = (state.typesSimples || []).filter(t => normKey(t) !== normKey(value));
          if (simple) state.typesSimples.push(value);
        }
        bump(uKey, value);
        saveRefs();
      }
      rebuild(); onPick(value);
    } else if (sel.value === "__del__"){
      const list = getList();
      if (list.length <= 1){ alert("Impossible : la liste doit garder au moins un choix."); rebuild(); return; }
      const menu = list.map((o, i) => (i + 1) + ". " + o).join("\n");
      const rep = (prompt("Quel choix retirer définitivement de la base ?\nTapez son numéro :\n\n" + menu) || "").trim();
      const idx = parseInt(rep, 10) - 1;
      if (!isNaN(idx) && idx >= 0 && idx < list.length){
        const removed = list.splice(idx, 1)[0];
        if (estListeTypes) state.typesSimples = (state.typesSimples || []).filter(t => normKey(t) !== normKey(removed));
        saveRefs();
        if (value === removed) value = list[0];
      }
      rebuild(); onPick(value);
    } else {
      value = sel.value;
      bump(uKey, value);
      paint();
      onPick(value);
    }
  });
  return sel;
}

const zonesBox = document.getElementById("zonesBox");
/* Un type est « simple » s'il est livré comme tel, ou s'il a été créé en mode simple par l'utilisateur */
const estSimple = (m) => (m.simple === true) ? true : (m.simple === false) ? false
  : memeChoix(TYPES_SIMPLES, m.type) !== undefined
  || memeChoix(state.typesSimples || [], m.type) !== undefined;
const estMiroir = (m) => m.type === "Miroir";
const matAFinir = (mat) => !MAT_SANS_FINITION.includes(mat);

function subTitle(){
  document.getElementById("subTitle").textContent =
    "AGENCEMENT · MENUISERIE — " + (state.chantier.nom || state.chantier.adresse || "nouveau chantier") + " · " + APP_VERSION;
}
function renderChantier(){
  const c = state.chantier;
  ["nom","client","dossier","devis","date","adresse","contact","accesPrecision"].forEach(k => {
    const inp = document.getElementById("c_" + k);
    inp.value = c[k] || "";
    inp.oninput = () => { c[k] = inp.value; if (k === "nom" || k === "adresse") subTitle(); };
  });
  const slot = document.getElementById("c_acces_slot");
  slot.innerHTML = "";
  slot.appendChild(makeSelect("acces", c.acces || "Plain-pied", v => { c.acces = v; }));
  const gen = document.getElementById("c_generalites");
  gen.value = state.generalites;
  gen.oninput = () => { state.generalites = gen.value; };
  subTitle();
}
function renderZones(){
  zonesBox.innerHTML = "";
  state.zones.forEach(z => zonesBox.appendChild(renderZone(z)));
}
function renderZone(z){
  const nomInput = el("input", { value: z.nom, placeholder: "NOM DE LA ZONE (Suite 1, Cuisine...)",
    onclick: e => e.stopPropagation(), oninput: e => { z.nom = e.target.value; } });
  const iz = state.zones.findIndex(x => x.id === z.id);
  const moveZone = (delta) => {
    const j = iz + delta;
    if (j < 0 || j >= state.zones.length) return;
    const tmp = state.zones[iz]; state.zones[iz] = state.zones[j]; state.zones[j] = tmp;
    renderZones(); saveAutoNow();
  };
  const head = el("div", { class: "zone-head", onclick: () => { z.open = !z.open; renderZones(); } },
    el("span", { class: "chev" }, z.open ? "▼" : "►"),
    nomInput,
    el("span", { class: "zone-count" }, z.meubles.length + " agencement" + (z.meubles.length > 1 ? "s" : "")),
    el("button", { class: "btn mini", title: "Monter cette zone", disabled: iz <= 0,
      onclick: e => { e.stopPropagation(); moveZone(-1); } }, "↑"),
    el("button", { class: "btn mini", title: "Descendre cette zone", disabled: iz >= state.zones.length - 1,
      onclick: e => { e.stopPropagation(); moveZone(1); } }, "↓"),
    el("button", { class: "btn mini", onclick: e => { e.stopPropagation(); if (confirm("Supprimer cette zone et ses agencements ?")){ state.zones = state.zones.filter(x => x.id !== z.id); renderZones(); } } }, "Supprimer"));
  const sec = el("section", { class: "zone" }, head);
  if (z.open){
    z.meubles.forEach(m => sec.appendChild(renderMeuble(z, m)));
    sec.appendChild(el("div", { class: "zone-foot" },
      el("button", { class: "btn", onclick: () => { z.meubles.push(newMeuble()); renderZones(); } }, "+ Ajouter un agencement")));
  }
  return sec;
}

/* ---- Corps commun : mêmes blocs pour un agencement OU un élément intégré ---- */
function checkboxRow(label, options, m, key, rerender){
  return el("div", { class: "chkrow" }, el("span", { class: "fld-l" }, label),
    options.map(o =>
      el("label", {},
        el("input", { type: "checkbox", checked: m[key].includes(o),
          onchange: e => {
            if (e.target.checked){ if (!m[key].includes(o)) m[key].push(o); }
            else m[key] = m[key].filter(x => x !== o);
            rerender();
          } }),
        el("span", {}, o))));
}
/* Cases à cocher avec, sous chaque case cochée, un champ « réf. » libre */
function checkboxRowRefs(label, options, m, key, refKey, rerender, ph){
  if (!m[refKey] || typeof m[refKey] !== "object") m[refKey] = {};
  return el("div", {},
    el("div", { class: "chkrow" }, el("span", { class: "fld-l" }, label),
      options.map(o =>
        el("label", {},
          el("input", { type: "checkbox", checked: m[key].includes(o),
            onchange: e => {
              if (e.target.checked){
                if (!m[key].includes(o)) m[key].push(o);
                if (!m[refKey][o]) m[refKey][o] = AD;   /* réf. à renseigner : « À définir » par défaut */
              }
              else { m[key] = m[key].filter(x => x !== o); delete m[refKey][o]; }
              rerender();
            } }),
          el("span", {}, o)))),
    m[key].length
      ? el("div", { class: "grid", style: "margin-top:6px" },
          m[key].map(o => {
            if (!m[refKey][o]) m[refKey][o] = AD;       /* fiches plus anciennes : même règle */
            const inp = el("input", { class: "inp" + (m[refKey][o] === AD ? " ad-val" : ""),
              value: m[refKey][o], placeholder: ph || "référence, modèle, coloris...",
              onfocus: e => { if (e.target.value === AD){ e.target.value = ""; e.target.className = "inp"; } },
              oninput: e => { m[refKey][o] = e.target.value; e.target.className = "inp"; },
              onblur: e => {
                if (!e.target.value.trim()){ m[refKey][o] = AD; e.target.value = AD; e.target.className = "inp ad-val"; }
              } });
            return field("Réf. " + o.toLowerCase(), inp, "220px");
          }))
      : null);
}
/* Plan de travail : matière, fournisseur + réf, options d'usinage — mêmes choix partout */
const estPdtBois = (m) => normKey(m.pdtMat) === normKey("Bois massif");

/* Déclinaisons d'une matière — IDENTIQUES quelle que soit la section (K = jeu de champs Caisson ou Façade) */
function declMatiereForm(arr, m, K, rerender){
  const mat = m[K.mat];
  if (MAT_CASCADE.includes(mat)){
    arr.push(field("Fournisseur", makeSelect("fournisseurs", m[K.four],
      v => { m[K.four] = v; m[K.ref] = AD; rerender(); }, "fournisseurs"), "160px"));
    if (m[K.four] !== AD && m[K.four] !== "—"){
      arr.push(field("Réf. " + m[K.four], makeSelect(() => cascadeListe("panneaux", m[K.four]),
        m[K.ref], v => { m[K.ref] = v; }, "panneaux." + m[K.four]), "170px"));
    }
    return;
  }
  if (mat === AD || mat === "—") return;
  const peinture = () => {
    arr.push(field("Fournisseur peinture", makeSelect("peintureFournisseurs", m[K.pFour],
      v => { m[K.pFour] = v; m[K.pRef] = AD; rerender(); }, "peintureFournisseurs"), "180px"));
    if (m[K.pFour] !== AD && m[K.pFour] !== "—"){
      arr.push(field("Réf. " + m[K.pFour], makeSelect(() => cascadeListe("peintures", m[K.pFour]),
        m[K.pRef], v => { m[K.pRef] = v; }, "peintures." + m[K.pFour]), "200px"));
    }
    arr.push(field("Aspect (mat / satiné / brillant)",
      makeSelect("peintureAspects", m[K.pAsp], v => { m[K.pAsp] = v; }, "peintureAspects"), "180px"));
  };
  if (mat === "MDF"){
    arr.push(el("div", { class: "fld", style: "min-width:100%" },
      checkboxRow("Finition MDF :", ["Brut","Apprêté","Peint"], m, K.mdf, rerender)));
    if (m[K.mdf].includes("Peint")) peinture();
  } else if (matAFinir(mat)){
    arr.push(field("Finition", makeSelect("finitions", m[K.fin], v => { m[K.fin] = v; rerender(); }), "140px"));
    if (m[K.fin] === "Peint") peinture();
    if (m[K.fin] === "Vernis") arr.push(field("Type de vernis", makeSelect("vernisTypes", m[K.vernis], v => { m[K.vernis] = v; }), "150px"));
    if (m[K.fin] === "Huilé (Rubio)") arr.push(field("Teinte d'huile", makeSelect("huileTeintes", m[K.huile], v => { m[K.huile] = v; }), "160px"));
  } else {
    arr.push(field("Réf. / décor", makeSelect("matRefs", m[K.ref], v => { m[K.ref] = v; }), "180px"));
  }
}

        field("Modèle", el("input", { class: "inp", value: m.coussinModele,
          placeholder: "nom du modèle, coloris, référence...",
          oninput: e => { m.coussinModele = e.target.value; } }), "240px"),
        bulle(m, "coussinNote"))));
  }

  /* PLAN DE TRAVAIL — type dédié, ou en complément d'une cuisine / salle de bain */
  if (estPdt(m)){
    nodes.push(el("div", { class: "bloc" }, el("div", { class: "bloc-t" }, "Plan de travail"),
      el("div", { class: "grid" }, planTravailForm(m, rerender))));
  }

  /* MIROIR : uniquement finition, épaisseur, spécifications (+ composition & notes plus bas) */
  if (estMiroir(m)){
    const mc = [
      field("Finition miroir", makeSelect("miroirTeintes", m.miroirTeinte, v => { m.miroirTeinte = v; }), "150px"),
      field("Épaisseur", makeSelect("miroirEps", m.miroirEp, v => { m.miroirEp = v; }), "120px"),
    ];
    mc.push(el("div", { class: "fld", style: "min-width:100%" },
      checkboxRow("Spécifications :", MIROIR_SPECS, m, "miroirSpecs", () => {})));
    mc.push(bulle(m, "facadeNote"));
    nodes.push(el("div", { class: "bloc" }, el("div", { class: "bloc-t" }, "Miroir"), el("div", { class: "grid" }, mc)));
  }

  /* CAISSON */
  if (!estSimple(m) && !estMiroir(m) && !estPdt(m)){
    const cc = [ field("Construction", makeSelect("caissonConstr", m.caissonConstr, v => { m.caissonConstr = v; rerender(); }), "190px") ];
    if (m.caissonConstr === "Sur mesure"){
      cc.push(field("Matériau", makeSelect("caissonMat", m.caissonMat, v => { m.caissonMat = v; rerender(); }), "170px"));
      declMatiereForm(cc, m, K_CAISSON, rerender);
    } else {
      cc.push(field("Fournisseur panneau", makeSelect("fournisseurs", m.caissonFournisseur,
        v => { m.caissonFournisseur = v; m.caissonRef = AD; rerender(); }, "fournisseurs"), "170px"));
      if (m.caissonFournisseur !== AD && m.caissonFournisseur !== "—"){
        cc.push(field("Réf. " + m.caissonFournisseur, makeSelect(() => cascadeListe("panneaux", m.caissonFournisseur),
          m.caissonRef, v => { m.caissonRef = v; }, "panneaux." + m.caissonFournisseur), "170px"));
      }
    }
    cc.push(bulle(m, "caissonNote"));
    nodes.push(el("div", { class: "bloc" }, el("div", { class: "bloc-t" }, "Caisson"), el("div", { class: "grid" }, cc)));
  }

  /* FAÇADE (ou « Matière & finition » pour les types simples) */
  if (!estMiroir(m) && !estPdt(m) && !estCoussin(m)){
    const fc = [];
    if (!estSimple(m)){
      fc.push(field("Type de façade", makeSelect("facadeTypes", m.facadeType, v => { m.facadeType = v; rerender(); }), "190px"));
      if (m.facadeType === "Cadre + remplissage"){
        fc.push(field("Type de remplissage", makeSelect("remplissageTypes", m.remplissageType,
          v => { m.remplissageType = v; rerender(); }), "170px"));
        if (m.remplissageType === "Tissu" || m.remplissageType === "Tapisserie"){
          fc.push(field("Fournisseur tissu", makeSelect("tissuFournisseurs", m.tissuFournisseur,
            v => { m.tissuFournisseur = v; m.tissuRef = AD; rerender(); }, "tissuFournisseurs"), "170px"));
          if (m.tissuFournisseur !== AD && m.tissuFournisseur !== "—"){
            fc.push(field("Réf. " + m.tissuFournisseur, makeSelect(() => cascadeListe("tissus", m.tissuFournisseur),
              m.tissuRef, v => { m.tissuRef = v; }, "tissus." + m.tissuFournisseur), "180px"));
          }
        }
        if (m.remplissageType === "Miroir"){
          fc.push(field("Miroir", makeSelect("miroirTeintes", m.miroirTeinte, v => { m.miroirTeinte = v; }), "140px"));
          fc.push(field("Pose du miroir", makeSelect("miroirPoses", m.miroirPose, v => { m.miroirPose = v; }), "150px"));
        }
      }
    }
    fc.push(field("Matière", makeSelect("facadeMat", m.facadeMat, v => { m.facadeMat = v; rerender(); }), "160px"));
    declMatiereForm(fc, m, K_FACADE, rerender);
    fc.push(bulle(m, "facadeNote"));
    nodes.push(el("div", { class: "bloc" },
      el("div", { class: "bloc-t" }, estSimple(m) ? "Matière & finition" : "Façade / matière & finition"),
      el("div", { class: "grid" }, fc)));
  }

  /* TÊTE DE LIT — remplissage (tissu, papier peint…) et cadre, tous deux optionnels */
  if (estTeteDeLit(m)){
    const rc = [ el("label", { class: "swch", style: "flex:0 0 auto" },
      el("input", { type: "checkbox", checked: m.remplissage,
        onchange: e => { m.remplissage = e.target.checked; rerender(); } }),
      el("span", {}, "Remplissage")) ];
    if (m.remplissage){
      rc.push(field("Type de remplissage", makeSelect("remplissageTypes", m.remplissageType,
        v => { m.remplissageType = v; rerender(); }), "180px"));
      const t = m.remplissageType;
      if (t === "Tissu" || t === "Tapisserie" || t === "Papier peint"){
        rc.push(field("Fournisseur", makeSelect("tissuFournisseurs", m.tissuFournisseur,
          v => { m.tissuFournisseur = v; m.tissuRef = AD; rerender(); }, "tissuFournisseurs"), "170px"));
        if (m.tissuFournisseur !== AD && m.tissuFournisseur !== "—"){
          rc.push(field("Réf. " + m.tissuFournisseur, makeSelect(() => cascadeListe("tissus", m.tissuFournisseur),
            m.tissuRef, v => { m.tissuRef = v; }, "tissus." + m.tissuFournisseur), "190px"));
        }
      } else if (t === "Miroir"){
        rc.push(field("Miroir", makeSelect("miroirTeintes", m.miroirTeinte, v => { m.miroirTeinte = v; }), "150px"));
        rc.push(field("Pose du miroir", makeSelect("miroirPoses", m.miroirPose, v => { m.miroirPose = v; }), "150px"));
      }
    }
    nodes.push(el("div", { class: "bloc" }, el("div", { class: "bloc-t" }, "Remplissage"), el("div", { class: "grid" }, rc)));

    const cc = [ el("label", { class: "swch", style: "flex:0 0 auto" },
      el("input", { type: "checkbox", checked: m.cadre,
        onchange: e => { m.cadre = e.target.checked; rerender(); } }),
      el("span", {}, "Cadre")) ];
    if (m.cadre){
      cc.push(field("Matériau du cadre", makeSelect("facadeMat", m.cadreMat, v => { m.cadreMat = v; rerender(); }), "170px"));
      declMatiereForm(cc, m, K_CADRE, rerender);   /* fournisseur, réf. et finitions selon le matériau */
      cc.push(bulle(m, "cadreNote"));
    }
    nodes.push(el("div", { class: "bloc" }, el("div", { class: "bloc-t" }, "Cadre"), el("div", { class: "grid" }, cc)));
  }

  /* VERRE — garde-corps : remplissage vitré optionnel */
  if (estGardeCorps(m)){
    const vc = [ el("label", { class: "swch", style: "flex:0 0 auto" },
      el("input", { type: "checkbox", checked: m.verre,
        onchange: e => { m.verre = e.target.checked; rerender(); } }),
      el("span", {}, "Verre")) ];
    if (m.verre){
      vc.push(field("Modèle de verre", makeSelect("verreTypes", m.verreType,
        v => { m.verreType = v; }, "verreTypes"), "180px"));
      vc.push(bulle(m, "verreNote"));
    }
    nodes.push(el("div", { class: "bloc" }, el("div", { class: "bloc-t" }, "Verre"), el("div", { class: "grid" }, vc)));
  }

  /* QUINCAILLERIE SPÉCIALE : hors standard atelier (Blum & co ne sont pas listés) */
  if (!estMiroir(m) && !estPdt(m) && !SANS_QUINC.includes(m.type)){
    const qc = [ el("label", { class: "swch", style: "flex:0 0 auto" },
      el("input", { type: "checkbox", checked: m.quincSpec,
        onchange: e => {
          m.quincSpec = e.target.checked;
          if (m.quincSpec && !m.quincailleries.length) m.quincailleries.push(newQuinc());
          rerender();
        } }),
      el("span", {}, "Quincaillerie spéciale")) ];
    const bloc = el("div", { class: "bloc" }, el("div", { class: "bloc-t" }, "Quincaillerie spéciale"),
      el("div", { class: "grid" }, qc));
    if (m.quincSpec){
      m.quincailleries.forEach(q => {
        bloc.appendChild(el("div", { class: "ligne-item" },
          field("Type", makeSelect("quincSpecTypes", q.cat,
            v => { q.cat = v; q.detail = AD; q.finition = AD; rerender(); }, "quincSpecTypes"), "200px"),
          (q.cat !== AD && q.cat !== "—")
            ? field("Réf. / modèle", makeSelect(() => cascadeListe("quincSpecDetails", q.cat),
                q.detail, v => { q.detail = v; }, "quincSpecDetails." + q.cat), "190px") : null,
          (q.cat !== AD && q.cat !== "—")
            ? field("Réf. complémentaire", el("input", { class: "inp", value: q.ref || "",
                placeholder: "réf. exacte, dimension, coloris...",
                oninput: e => { q.ref = e.target.value; } })) : null,
          (q.cat !== AD && q.cat !== "—")
            ? field("Finition", makeSelect("quincFinitions", q.finition, v => { q.finition = v; }), "140px") : null,
          el("button", { class: "btn mini", onclick: () => { m.quincailleries = m.quincailleries.filter(x => x.id !== q.id); rerender(); } }, "×")));
      });
      bloc.appendChild(el("div", { class: "grid" },
        el("button", { class: "btn mini", style: "flex:0 0 auto", onclick: () => { m.quincailleries.push(newQuinc()); rerender(); } }, "+ Ajouter une quincaillerie spéciale"),
        bulle(m, "quincNote")));
    }
    nodes.push(bloc);
  }

  /* POIGNÉES + TRINGLE */
  if (!estSimple(m) && !estMiroir(m) && !estPdt(m)){
    const pc = [ el("label", { class: "swch", style: "flex:0 0 auto" },
      el("input", { type: "checkbox", checked: m.poignees !== false,
        onchange: e => { m.poignees = e.target.checked; rerender(); } }),
      el("span", {}, "Poignées")) ];
    if (m.poignees === false){
      /* sans poignée : rien d'autre à renseigner */
      nodes.push(el("div", { class: "bloc" }, el("div", { class: "bloc-t" }, "Poignées"), el("div", { class: "grid" }, pc)));
    } else {
    pc.push(field("Type de poignée", makeSelect("poigneeTypes", m.poigneeType, v => { m.poigneeType = v; rerender(); }), "190px"));
    if (m.poigneeType === "Bouton de porte"){
      pc.push(field("Réf. bouton", makeSelect("boutonRefs", m.poigneeRef || AD,
        v => { m.poigneeRef = (v === AD ? "" : v); }, "boutonRefs"), "180px"));
      pc.push(field("Finition", makeSelect("poigneeFinitions", m.poigneeFinition, v => { m.poigneeFinition = v; }), "170px"));
    } else if (m.poigneeType === "Push-pull"){
      pc.push(field("Couleur", makeSelect("pushPullCouleurs", state.refs.pushPullCouleurs.includes(m.poigneeFinition) ? m.poigneeFinition : AD,
        v => { m.poigneeFinition = v; }), "140px"));
    } else if (m.poigneeType === "Prise de doigt"){
      pc.push(field("Forme", makeSelect("priseTypes", m.poigneePrise, v => { m.poigneePrise = v; rerender(); }), "150px"));
      if (m.poigneePrise === "Profilé"){
        pc.push(field("Réf. profilé", makeSelect("profilRefs", m.profilRef, v => { m.profilRef = v; }), "160px"));
      }
      /* pas de finition ni de nombre pour une prise de doigt */
    } else if (m.poigneeType === "Fournie par le client" || m.poigneeType === AD || m.poigneeType === "—"){
      /* aucun choix supplémentaire */
    } else {
      pc.push(field("Réf. / détail", el("input", { class: "inp", value: m.poigneeRef, oninput: e => { m.poigneeRef = e.target.value; } })));
      pc.push(field("Finition", makeSelect("poigneeFinitions", m.poigneeFinition, v => { m.poigneeFinition = v; }), "160px"));
    }
    if (m.poigneeType !== AD && m.poigneeType !== "—" && m.poigneeType !== "Prise de doigt"){
      pc.push(field("Nombre", el("input", { class: "inp mono", value: m.nbPoignees, oninput: e => { m.nbPoignees = e.target.value; } }), "90px"));
    }
    pc.push(bulle(m, "poigneeNote"));
    nodes.push(el("div", { class: "bloc" }, el("div", { class: "bloc-t" }, "Poignées"), el("div", { class: "grid" }, pc)));
    }

    if (!SANS_TRINGLE.includes(m.type)){
      const tr = [ el("label", { class: "swch", style: "flex:0 0 auto" },
        el("input", { type: "checkbox", checked: m.tringle, onchange: e => { m.tringle = e.target.checked; rerender(); } }),
        el("span", {}, "Tringle")) ];
      if (m.tringle) tr.push(field("Finition tringle", makeSelect("tringleFinitions", m.tringleFinition, v => { m.tringleFinition = v; }), "160px"));
      nodes.push(el("div", { class: "bloc" }, el("div", { class: "bloc-t" }, "Tringle"), el("div", { class: "grid" }, tr)));
    }
  }

  /* LED */
  if (!SANS_LED.includes(m.type)){
    const lc = [ el("label", { class: "swch", style: "flex:0 0 auto" },
      el("input", { type: "checkbox", checked: m.led, onchange: e => { m.led = e.target.checked; rerender(); } }),
      el("span", {}, "LED")) ];
    if (m.led){
      lc.push(field("Couleur", makeSelect("ledCouleurs", m.ledCouleur, v => { m.ledCouleur = v; }), "190px"));
      lc.push(field("Emplacement", makeSelect("ledEmpl", m.ledEmpl, v => { m.ledEmpl = v; }), "210px"));
    }
    nodes.push(el("div", { class: "bloc" }, el("div", { class: "bloc-t" }, "Éclairage LED"), el("div", { class: "grid" }, lc)));
  }

  /* composition / notes (toujours, y compris Miroir : dimensions en composition) */
  nodes.push(el("div", { class: "grid", style: "margin-top:10px" },
    field(estMiroir(m) ? "Composition / dimensions (un miroir par ligne)" : "Composition (une ligne par élément : colonnes, caissons, tiroirs...)",
      el("textarea", { class: "inp", rows: 3, value: m.composition,
        placeholder: estMiroir(m) ? "Miroir salle d'eau L. 1070x H. 1700" : "1 colonne — 3 tiroirs, 4 étagères, 1 porte",
        oninput: e => { m.composition = e.target.value; } }))));
  nodes.push(el("div", { class: "grid", style: "margin-top:10px" },
    field("Notes (précisions de fabrication, imprimées sous la composition)",
      el("textarea", { class: "inp", rows: 2, value: m.notes,
        placeholder: "Double fond électricité, chants plaqués, sens du fil...",
        oninput: e => { m.notes = e.target.value; } }))));
  nodes.push(el("div", { class: "grid", style: "margin-top:10px" },
    field("⚠ Points d'attention (imprimés en rouge)",
      el("textarea", { class: "inp", rows: 2, value: m.attention,
        placeholder: "Plan de travail hors lot, cotes à confirmer, prévoir renfort...",
        oninput: e => { m.attention = e.target.value; } }))));
  return nodes;
}

function renderMeuble(z, m){
  const card = el("div", { class: "meuble" });
  const rerender = () => { card.replaceWith(renderMeuble(z, m)); };

  const badge = SANS_LIVRAISON.includes(m.type) ? null
    : el("span", { class: "badge-liv" + (m.livraison === AD ? " ad" : "") }, m.livraison);
  card.appendChild(el("div", { class: "m-head" },
    el("input", { class: "m-code", value: m.code, placeholder: "n° lot",
      oninput: e => { m.code = e.target.value; } }),
    el("input", { class: "m-nom", value: m.nom, placeholder: "Désignation de l'agencement...",
      oninput: e => { m.nom = e.target.value; } }),
    badge,
    el("div", { class: "row-actions" },
      (() => {
        const i = z.meubles.findIndex(x => x.id === m.id);
        const move = (delta) => {
          const j = i + delta;
          if (j < 0 || j >= z.meubles.length) return;
          const tmp = z.meubles[i]; z.meubles[i] = z.meubles[j]; z.meubles[j] = tmp;
          renderZones(); saveAutoNow();
        };
        return [
          el("button", { class: "btn mini", title: "Monter cet agencement",
            disabled: i <= 0, onclick: () => move(-1) }, "↑"),
          el("button", { class: "btn mini", title: "Descendre cet agencement",
            disabled: i >= z.meubles.length - 1, onclick: () => move(1) }, "↓"),
        ];
      })(),
      (state.zones.length > 1)
        ? el("select", { class: "sel mini-sel", title: "Déplacer vers une autre zone",
            onchange: e => {
              const cible = state.zones.find(x => x.id === e.target.value);
              if (!cible || cible.id === z.id){ e.target.value = ""; return; }
              z.meubles = z.meubles.filter(x => x.id !== m.id);
              cible.meubles.push(m);
              cible.open = true;
              renderZones(); saveAutoNow();
              setStatus("ok", "« " + (m.nom || m.code || "Agencement") + " » déplacé vers la zone « " +
                (cible.nom || "sans nom") + " ».");
            } },
            el("option", { value: "" }, "↔ Déplacer vers…"),
            state.zones.filter(x => x.id !== z.id).map((x, i) =>
              el("option", { value: x.id }, (x.nom || "Zone " + (state.zones.indexOf(x) + 1)))))
        : null,
      el("button", { class: "btn mini", onclick: () => { const c = deep(m); c.id = uid(); c.nom = m.nom + " (copie)"; (c.elements||[]).forEach(x => x.id = uid()); (c.quincailleries||[]).forEach(x => x.id = uid()); z.meubles.splice(z.meubles.findIndex(x => x.id === m.id) + 1, 0, c); renderZones(); } }, "Dupliquer"),
      el("button", { class: "btn mini", onclick: () => { z.meubles = z.meubles.filter(x => x.id !== m.id); renderZones(); } }, "Retirer"))));

  card.appendChild(el("div", { class: "grid" },
    field("Type", makeSelect("types", m.type, v => { m.type = v; rerender(); }), "200px"),
    SANS_LIVRAISON.includes(m.type) ? null
      : field("Mode de livraison", makeSelect("livraisons", m.livraison, v => { m.livraison = v; rerender(); }), "200px")));

  /* Éléments intégrés : tablette, bureau, miroir, piètement — fiches complètes */
  const elemCards = m.elements.map(it => {
    const sub = el("div", { class: "sous-item" });
    sub.appendChild(el("div", { class: "ligne-item" },
      field("Élément", makeSelect("elementTypes", it.type, v => { it.type = v; rerender(); }), "160px"),
      field("Désignation / précision",
        el("input", { class: "inp", value: it.nom || "", placeholder: "ex : tablette chêne ép.30, bureau suspendu L.1200…",
          oninput: e => { it.nom = e.target.value; } })),
      el("button", { class: "btn mini", onclick: () => { m.elements = m.elements.filter(x => x.id !== it.id); rerender(); } }, "×")));
    if (it.type !== AD) renderCorps(it, rerender).forEach(n => sub.appendChild(n));
    return sub;
  });
  if (!estMiroir(m)) card.appendChild(el("div", { class: "bloc" },
    el("div", { class: "bloc-t" }, "Éléments intégrés à l'agencement"),
    elemCards,
    el("button", { class: "btn mini", onclick: () => { m.elements.push(newElement(true)); rerender(); } },
      "+ Élément simple (tablette, plan de travail, miroir…)"),
    el("button", { class: "btn mini", style: "margin-left:6px", onclick: () => { m.elements.push(newElement(false)); rerender(); } },
      "+ Élément détaillé (caisson, façade, poignées…)")));

  renderCorps(m, rerender).forEach(n => card.appendChild(n));
  return card;
}

/* ================= FEUILLE IMPRIMABLE ================= */
const isAD = (v) => v === AD;
const nn = (v) => v && v !== AD && v !== "—";
function fv(v){
  if (isAD(v)) return el("span", { class: "ad" }, AD);
  if (!v || v === "—") return el("span", { class: "p-lab" }, "—");
  return el("span", { class: "p-val" }, v);
}
function pline(label, ...vals){
  return el("div", { class: "p-line" }, el("span", { class: "p-lab" }, label + " : "), vals);
}
function declMatierePrint(fl, m, K){
  const mat = m[K.mat];
  if (MAT_CASCADE.includes(mat)){
    fl.push(pline("Décor", fv(m[K.four]), nn(m[K.four]) ? [" ", fv(m[K.ref])] : ""));
    return;
  }
  if (mat === AD || mat === "—") return;
  if (mat === "MDF"){
    fl.push(pline("Finition MDF", m[K.mdf] && m[K.mdf].length ? el("span", { class: "p-val" }, m[K.mdf].join(" + ")) : el("span", { class: "ad" }, AD)));
    if (m[K.mdf] && m[K.mdf].includes("Peint"))
      fl.push(pline("Peinture", fv(m[K.pFour]), nn(m[K.pFour]) ? [" ", fv(m[K.pRef])] : "",
        nn(m[K.pAsp]) ? [" · ", fv(m[K.pAsp])] : ""));
  } else if (matAFinir(mat)){
    fl.push(pline("Finition", fv(m[K.fin])));
    if (m[K.fin] === "Peint") fl.push(pline("Peinture", fv(m[K.pFour]), nn(m[K.pFour]) ? [" ", fv(m[K.pRef])] : "",
      nn(m[K.pAsp]) ? [" · ", fv(m[K.pAsp])] : ""));
    if (m[K.fin] === "Vernis") fl.push(pline("Vernis", fv(m[K.vernis])));
    if (m[K.fin] === "Huilé (Rubio)") fl.push(pline("Teinte huile", fv(m[K.huile])));
  } else if (nn(m[K.ref])) fl.push(pline("Réf. décor", fv(m[K.ref])));
}
/* Liste d'éléments cochés avec leur référence ; « À définir » ressort en rouge */
function listeAvecRefs(items, refs){
  const box = el("span", {});
  items.forEach((x, i) => {
    if (i) box.appendChild(document.createTextNode(" · "));
    box.appendChild(el("span", { class: "p-val" }, x));
    const r = refs && refs[x];
    if (!r) return;
    box.appendChild(document.createTextNode(" ("));
    box.appendChild(isAD(r) ? el("span", { class: "ad" }, AD) : el("span", { class: "p-val" }, r));
    box.appendChild(document.createTextNode(")"));
  });
  return box;
}
function corpsSections(m){
  const secs = [];
  const sec = (title, lines, full) => { if (lines.length) secs.push(el("div", { class: "p-sec" + (full ? " full" : "") }, el("div", { class: "p-sec-t" }, title), lines)); };

  if (estCuisine(m)){
    const ec = [];
    if (m.electro){
      ec.push(pline("Fourni par", fv(m.electroFournisseur)));
      ec.push(el("div", { class: "p-line" }, el("span", { class: "p-lab" }, "Éléments : "),
        m.electroElements.length ? listeAvecRefs(m.electroElements, m.electroRefs) : el("span", { class: "ad" }, AD)));
      if (m.electroNote) ec.push(el("div", { class: "p-line p-note" }, "💬 " + m.electroNote));
    } else ec.push(el("div", { class: "p-line" }, "Électroménager non fourni"));
    sec("Électroménager", ec);
  }
  if (estCoussin(m)){
    const cc = [ pline("Matière", fv(m.coussinMat)),
      pline("Fournisseur", fv(m.coussinFournisseur)),
      pline("Modèle", m.coussinModele ? el("span", { class: "p-val" }, m.coussinModele) : el("span", { class: "ad" }, AD)) ];
    if (m.coussinNote) cc.push(el("div", { class: "p-line p-note" }, "💬 " + m.coussinNote));
    sec("Coussin / Tapisserie", cc);
  }
  if (estPdt(m)){
    const pc = [ pline("Matière", fv(m.pdtMat)) ];
    if (estPdtBois(m)) pc.push(pline("Essence", fv(m.pdtEssence)));
    else pc.push(pline("Fournisseur", fv(m.pdtFournisseur), nn(m.pdtFournisseur) ? [" ", fv(m.pdtRef)] : ""));
    pc.push(pline("Épaisseur", fv(m.pdtEp)));
    if (estPdtBois(m)) declMatierePrint(pc, m, K_PDT);
    pc.push(el("div", { class: "p-line" }, el("span", { class: "p-lab" }, "Usinages : "),
      m.pdtOptions.length ? listeAvecRefs(m.pdtOptions, m.pdtRefs) : el("span", { class: "ad" }, AD)));
    if (m.pdtNote) pc.push(el("div", { class: "p-line p-note" }, "💬 " + m.pdtNote));
    sec("Plan de travail", pc);
  }

  if (estMiroir(m)){
    sec("Miroir", [
      pline("Finition", fv(m.miroirTeinte)),
      pline("Épaisseur", fv(m.miroirEp)),
      pline("Spécifications", m.miroirSpecs.length ? el("span", { class: "p-val" }, m.miroirSpecs.join(" + ")) : el("span", { class: "ad" }, AD)),
      m.facadeNote ? el("div", { class: "p-line p-note" }, "💬 " + m.facadeNote) : null,
    ].filter(Boolean));
  }
  if (!estSimple(m) && !estMiroir(m) && !estPdt(m)){
    const cl = [ pline("Construction", fv(m.caissonConstr)) ];
    if (m.caissonConstr === "Sur mesure"){
      cl.push(pline("Matériau", fv(m.caissonMat)));
      declMatierePrint(cl, m, K_CAISSON);
    } else {
      cl.push(pline("Panneau", fv(m.caissonFournisseur), nn(m.caissonFournisseur) ? [" ", fv(m.caissonRef)] : ""));
    }
    if (m.caissonNote) cl.push(el("div", { class: "p-line p-note" }, "💬 " + m.caissonNote));
    sec("Caisson", cl);
  }
  if (!estMiroir(m) && !estPdt(m) && !estCoussin(m)){
    const fl = [];
    if (!estSimple(m)){
      fl.push(pline("Type", fv(m.facadeType)));
      if (m.facadeType === "Cadre + remplissage"){
        fl.push(pline("Remplissage", fv(m.remplissageType)));
        if (m.remplissageType === "Tissu" || m.remplissageType === "Tapisserie")
          fl.push(pline("Tissu", fv(m.tissuFournisseur), nn(m.tissuFournisseur) ? [" ", fv(m.tissuRef)] : ""));
        if (m.remplissageType === "Miroir")
          fl.push(pline("Miroir", fv(m.miroirTeinte), " · ", fv(m.miroirPose)));
      }
    }
    fl.push(pline("Matière", fv(m.facadeMat)));
    declMatierePrint(fl, m, K_FACADE);
    if (m.facadeNote) fl.push(el("div", { class: "p-line p-note" }, "💬 " + m.facadeNote));
    sec(estSimple(m) ? "Matière & finition" : "Façade / matière & finition", fl);

    if (estTeteDeLit(m) && m.remplissage){
      const rl = [ pline("Type", fv(m.remplissageType)) ];
      const t = m.remplissageType;
      if (t === "Tissu" || t === "Tapisserie" || t === "Papier peint")
        rl.push(pline("Fournisseur", fv(m.tissuFournisseur), nn(m.tissuFournisseur) ? [" ", fv(m.tissuRef)] : ""));
      else if (t === "Miroir") rl.push(pline("Miroir", fv(m.miroirTeinte), " · ", fv(m.miroirPose)));
      sec("Remplissage", rl);
    }
    if (estTeteDeLit(m) && m.cadre){
      const cl = [ pline("Matériau", fv(m.cadreMat)) ];
      declMatierePrint(cl, m, K_CADRE);
      if (m.cadreNote) cl.push(el("div", { class: "p-line p-note" }, "💬 " + m.cadreNote));
      sec("Cadre", cl);
    }
    if (estGardeCorps(m) && m.verre){
      const vl = [ pline("Modèle", fv(m.verreType)) ];
      if (m.verreNote) vl.push(el("div", { class: "p-line p-note" }, "💬 " + m.verreNote));
      sec("Verre", vl);
    }
    if (!SANS_QUINC.includes(m.type) && m.quincSpec){
      const qReal = m.quincailleries.filter(q => q.cat !== "—");
      const ql = qReal.map(q =>
        el("div", { class: "p-line" }, "• ", fv(q.cat),
          nn(q.cat) ? [" — ", fv(q.detail), (q.ref ? el("span", { class: "p-val" }, " (" + q.ref + ")") : ""), " · ", fv(q.finition)] : ""));
      if (m.quincNote) ql.push(el("div", { class: "p-line p-note" }, "💬 " + m.quincNote));
      sec("Quincaillerie spéciale", ql);
    }
  }
  if (!estSimple(m) && !estMiroir(m) && !estPdt(m)){
    const pl = [];
    if (m.poignees === false){
      pl.push(el("div", { class: "p-line" }, el("span", { class: "p-lab" }, "Poignées : "),
        el("span", { class: "p-val" }, "Sans poignée")));
    } else {   /* la note de poignée n'est imprimée que si les poignées sont présentes */
      const po = el("div", { class: "p-line" }, el("span", { class: "p-lab" }, "Poignées : "), fv(m.poigneeType));
      if (m.poigneeType === "Prise de doigt"){
        po.appendChild(document.createTextNode(" · ")); po.appendChild(fv(m.poigneePrise));
        if (m.poigneePrise === "Profilé"){ po.appendChild(document.createTextNode(" ")); po.appendChild(fv(m.profilRef)); }
      }
      if (nn(m.poigneeRef)) po.appendChild(el("span", { class: "p-val" }, " — " + m.poigneeRef));
      if (m.poigneeType !== "Fournie par le client" && m.poigneeType !== "Prise de doigt"
          && m.poigneeType !== AD && m.poigneeType !== "—"){
        po.appendChild(document.createTextNode(" · ")); po.appendChild(fv(m.poigneeFinition));
      }
      if (m.nbPoignees && m.poigneeType !== "Prise de doigt") po.appendChild(el("span", { class: "p-val" }, " ×" + m.nbPoignees));
      pl.push(po);
    }
    if (m.tringle) pl.push(pline("Tringle", fv(m.tringleFinition)));
    if (m.poigneeNote && m.poignees !== false) pl.push(el("div", { class: "p-line p-note" }, "💬 " + m.poigneeNote));
    sec("Poignées & tringle", pl);
  }
  if (m.led && !SANS_LED.includes(m.type)) sec("Éclairage LED", [ el("div", { class: "p-line" }, fv(m.ledCouleur), " — ", fv(m.ledEmpl)) ]);
  if (m.composition) sec(estMiroir(m) ? "Composition / dimensions" : "Composition", [ el("div", { class: "p-mono" }, m.composition) ], true);
  if (m.notes){
    secs.push(el("div", { class: "p-sec full p-notes" },
      el("div", { class: "p-sec-t" }, "Notes"),
      el("div", { class: "p-mono" }, m.notes)));
  }
  if (m.attention){
    secs.push(el("div", { class: "p-sec full p-notes-box" },
      el("div", { class: "p-sec-t" }, "⚠ Points d'attention"),
      el("div", { class: "p-mono" }, m.attention)));
  }
  return secs;
}

/* ---- Sérialisation compacte : on n'embarque que ce qui diffère des valeurs par défaut ---- */
function compactMeuble(m){
  const tpl = newMeuble();
  const o = {};
  for (const k in tpl){
    if (k === "id") continue;
    const v = m[k];
    if (k === "elements"){ const a = (v || []).map(compactMeuble); if (a.length) o.elements = a; continue; }
    if (k === "quincailleries"){
      const a = (v || []).map(q => ({ cat: q.cat, detail: q.detail, finition: q.finition, ref: q.ref || "" }));
      if (a.length) o.quincailleries = a; continue;
    }
    if (Array.isArray(v)){ if (v.length) o[k] = v; continue; }
    if (v && typeof v === "object"){
      const net = {};
      for (const kk in v) if (v[kk]) net[kk] = v[kk];
      if (Object.keys(net).length) o[k] = net;
      continue;
    }
    if (v !== tpl[k]) o[k] = v;
  }
  return o;
}
function b64EncodeUtf8(s){
  const bytes = new TextEncoder().encode(s);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return btoa(bin);
}
function b64DecodeUtf8(b){
  const bin = atob(b);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function download(name, content, type){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name;
  a.click(); URL.revokeObjectURL(a.href);
}
function exportJSON(){
  download("fiche-" + ((state.chantier.nom || state.chantier.adresse || "chantier").slice(0, 40)).replace(/[^\wÀ-ü-]+/g, "_") + ".json",
    JSON.stringify(state, null, 1), "application/json");
}
/* Réaligne une valeur enregistrée sur l'orthographe de référence de la liste */
function alignRef(listKey, v, fallback){
  if (v === undefined || v === null || v === "") return (fallback !== undefined ? fallback : v);
  if (v === AD || v === "—") return v;
  return memeChoix(state.refs[listKey], v) || v;
}
function reviveMeuble(m){
  return complete(Object.assign(newMeuble(), m, {
    id: uid(),
    poigneePrise: renomme(m.poigneePrise),
    poignees: (m.poigneeType === "Sans poignée") ? false : (m.poignees !== false),
    poigneeType: (m.poigneeType === "Sans poignée" || m.poigneeType === undefined) ? AD : m.poigneeType,
    type: alignRef("types", m.type, AD),
    livraison: alignRef("livraisons", m.livraison, AD),
    elements: (m.elements || []).map(x => reviveMeuble(Object.assign({}, x, { nom: x.nom || x.detail || "" }))),
    quincailleries: (m.quincailleries || []).map(x => Object.assign(newQuinc(), x, { id: uid() })),
    mdfFinitions: Array.isArray(m.mdfFinitions) ? m.mdfFinitions : [],
    caissonMdfFinitions: Array.isArray(m.caissonMdfFinitions) ? m.caissonMdfFinitions : [],
    miroirSpecs: Array.isArray(m.miroirSpecs) ? m.miroirSpecs : [],
    pdtOptions: Array.isArray(m.pdtOptions) ? m.pdtOptions : [],
    pdtRefs: (m.pdtRefs && typeof m.pdtRefs === "object") ? Object.assign({}, m.pdtRefs) : {},
    pdtMdfFinitions: Array.isArray(m.pdtMdfFinitions) ? m.pdtMdfFinitions : [],
    cadreMdfFinitions: Array.isArray(m.cadreMdfFinitions) ? m.cadreMdfFinitions : [],
    simple: (m.simple === true || m.simple === false) ? m.simple : null,
    electroElements: Array.isArray(m.electroElements) ? m.electroElements : [],
    electroRefs: (m.electroRefs && typeof m.electroRefs === "object") ? Object.assign({}, m.electroRefs) : {},
  }));
}
/* Filet de sécurité : tout champ absent ou indéfini reprend sa valeur par défaut */
function complete(m){
  const tpl = newMeuble();
  for (const k in tpl){
    if (m[k] === undefined || m[k] === null) m[k] = Array.isArray(tpl[k]) ? [] : (tpl[k] && typeof tpl[k] === "object" ? {} : tpl[k]);
  }
  (m.elements || []).forEach(complete);
  return m;
}
function importJSONFile(f){
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (d.chantier) state.chantier = Object.assign({ acces: "Plain-pied", accesPrecision: "" }, d.chantier);
      if (typeof d.generalites === "string") state.generalites = d.generalites;
      if (Array.isArray(d.zones)) state.zones = d.zones.map(z => ({
        id: uid(), nom: z.nom || "", open: true,
        meubles: (z.meubles || []).map(reviveMeuble),
      }));
      if (d.refs) for (const k in state.refs){
        if (Array.isArray(d.refs[k]) && d.refs[k].length) state.refs[k] = d.refs[k].slice();
      }
      if (d.cascades) for (const g in state.cascades){
        if (d.cascades[g]) for (const f2 in d.cascades[g]){
          if (Array.isArray(d.cascades[g][f2]) && d.cascades[g][f2].length) state.cascades[g][f2] = d.cascades[g][f2].slice();
        }
      }
      if (d.usage) state.usage = d.usage;
      if (Array.isArray(d.typesSimples))
        d.typesSimples.forEach(t => { if (!memeChoix(state.typesSimples, t)) state.typesSimples.push(t); });
      saveRefs();
      renderChantier(); renderZones();
      setStatus("ok", "Fiche importée.");
    } catch(e){ setStatus("err", "Fichier JSON invalide."); }
  };
  r.readAsText(f);
}
